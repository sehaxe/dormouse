name: fused-library

# The gate for `vendor/dormouse-fused` — the fused-kernel library (20 crates; was
# 28 until 2026-09-28, when 8 unreachable crates were deleted — the per-crate
# fate table is docs/architecture/library-crate-fate.md).
#
# WHY THIS FILE EXISTS. `vendor/dormouse-fused` has no `.git` of its own and the
# root `Cargo.toml` `exclude`s it (its crates are separate cargo workspace
# roots; without the exclude, their `workspace = true` inheritance resolves
# against OUR root and fails). So the fork's own `.github/workflows/ci.yml` has
# never executed for this copy: it is inherited fiction, and for six months it
# still referenced `burn-msa`, a crate deleted 2026-09-27 (ADR-0014). Meanwhile
# the root workspace does not build the fork's members (they are pulled in by
# explicit `path =` deps of dormouse-core, which `cargo test --workspace` at the
# root never compiles on their own). Net effect: no crate in the library was
# gated by a run that could fail.
#
# Every job below therefore sets `working-directory: vendor/dormouse-fused` and runs
# cargo FROM INSIDE the fork. Running `cargo test -p burn-gdn2` from the root
# fails with "package not found" — that is the exclude working as intended, not
# a code problem. Do not "fix" it by dropping the exclude.
#
# Job names name the FAILURE MODE, on purpose: this project's history is a
# series of failures that stayed invisible until something asserted them.

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # cubecl compiles CUDA kernels through NVRTC at runtime, so the cuda-feature
  # jobs need the toolkit on PATH (the ubuntu runner image ships it) but no GPU.
  CUDARC_CUDA_VERSION: "12050"

jobs:
  # 1. every crate, on the ndarray backend, in one command
  # GREEN as of 2026-10-02. The first-run red named below is closed: the three
  # burn-spectral tests built their fixtures on the plain ndarray device, and
  # `retract`'s `set_require_grad(true)` is an assert on a non-autodiff device
  # (burn 0.22) — they panicked before they asserted. The fixtures now build on
  # `Autodiff<NdArray>` (the device the retraction actually targets), so the
  # tests run their assertions instead of dying in setup; see
  # vendor/dormouse-fused/TEST-AUDIT.md finding 2.
  ndarray-all-crates:
    name: "fused-lib :: ndarray check+test, all 20 crates (a broken CPU build)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vendor/dormouse-fused
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/dormouse-fused
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: check every target of every crate (lib + tests + examples)
        run: cargo check --workspace --all-targets --exclude burn-fused-benches --exclude cpu-probe --exclude launch-probe
      - name: test every crate on ndarray
        run: cargo test --workspace --exclude burn-fused-benches --exclude cpu-probe --exclude launch-probe
      - name: clippy, warnings are errors
        run: cargo clippy --workspace --all-targets --exclude burn-fused-benches --exclude cpu-probe --exclude launch-probe -- -D warnings
      - name: rustfmt
        run: cargo fmt --all -- --check

  # 2. the feature combinations a user actually picks
  feature-matrix:
    name: "fused-lib :: feature matrix (a --no-default-features / autodiff / binary-tests that stopped building)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vendor/dormouse-fused
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/dormouse-fused
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: "the facade: generated files in sync + every feature combination"
        # The re-export list and the feature flags are GENERATED from the
        # member manifests (tools/gen_facade.py), and this is the gate that
        # keeps them honest: 13 crates declare `cuda`, the hand-written list
        # named 12 (burn-mor missing) for months, and nothing noticed. The
        # script also checks the generated files and builds every combination
        # a user can type; the two common ones run the test suite, which is
        # what resolves all 20 re-exports.
        run: tools/test-feature-matrix.sh
      - name: leaf crates, every combination a README tells users to type
        run: |
          cargo check -p burn-gdn2 --no-default-features
          cargo check -p burn-gdn2
          cargo check -p burn-gdn2 --features autodiff
          cargo check -p burn-gdn2 --features binary-tests
          cargo check -p burn-kda --no-default-features
          cargo check -p burn-kda --features autodiff

  # 3. the flagship claim: the reference fixture is regenerable and unchanged
  #
  # The generator is now `tools/gen_reference_f64.py` (f64 NumPy, no torch), and
  # the fixture is `tests/ref_f64_broad.bin` - the 1000-case breadth sweep. The
  # f32 self-transcription this job used to police (`tools/gen_reference.rs` ->
  # `tests/ref_data.bin`) is DELETED: it was an f32 transcription of burn-gdn2's
  # OWN algorithm, so it could only ever prove self-consistency, and it replicate-
  # padded the short conv's left edge exactly as the kernel wrongly did - which
  # is how a real defect (`0a6998a`) stayed green in this very job.
  ref-data-reproducible:
    name: "fused-lib :: ref_f64_broad.bin is what its generator emits (a fixture that drifted from its generator)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vendor/dormouse-fused/crates/burn-gdn2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PINNED, and measured. This step was red on 5 of the last 10 runs OF THE
      # IDENTICAL COMMIT - green, red, red, red, green, green, red, green, red,
      # green going back - so the axis was never the version: a green and a red
      # run of the same sha both installed `numpy-2.5.3-cp312-cp312-manylinux`.
      # It is the HOST. The f64 outputs are numpy reductions whose summation
      # order is picked by the runtime CPU dispatch, and the generator's
      # matmuls go through an OpenBLAS whose own build string says
      # `DYNAMIC_ARCH` (measured here: `OpenBLAS 0.3.34.106.0 USE64BITINT
      # DYNAMIC_ARCH`), i.e. it selects its kernels per host CPU. Two runners,
      # two orders, two last bits. Re-measured on this box, and the axes that
      # could have been pinned are all zero-width here: numpy 2.5.3 under
      # python 3.14 and 3.12 give byte-identical fixtures, and
      # OMP_NUM_THREADS=1 changes nothing.
      - name: numpy, pinned to the version the committed bytes were made with
        run: pip install "numpy==2.5.3"
      # Single-threaded BLAS: the other half of the same axis, and free.
      - name: one BLAS thread (determinism of the reductions)
        run: echo "OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1" >> "$GITHUB_ENV"
      # BOTH f64 fixtures, and the committed wrong-formula companion, so a
      # generator edit cannot quietly move the negative control either.
      #
      # NOT `git diff --exit-code`, and that is the measured correction, not a
      # softening: byte-equality was this job's contract on 2026-09-27 and it
      # was FALSE - a correct regeneration on a different host is not
      # byte-identical, which is why the same commit passed and failed all day.
      # `check_f64_fixtures.py` is the tool the repo already ships and
      # `tools/lib_gate.sh` already runs, and it splits the contract where the
      # arithmetic actually splits it: the f32 weights and inputs are compared
      # BIT-EXACTLY (the RNG is stdlib integer math, so any difference there is
      # a changed input, not rounding), and only the f64 OUTPUTS get 1e-12
      # relative - measured round-off on this generator is <= 4.4e-15
      # (typically ~7e-16) and the SMALLEST wrong formula sits 4.1e+11 further
      # out, so the bar cannot pass a semantic change and cannot trip on
      # rounding. It also regenerates into a temp dir, so the working tree is
      # never mutated and the comparison cannot pass by being unable to run.
      - name: the committed fixtures must be what this generator emits
        run: python3 tools/check_f64_fixtures.py --verbose

  # 4. the flagship claim: burn against the f64 oracle
  # GREEN as of 2026-09-29, --release, ndarray: 1000 cases on the
  # fused-recurrent arm and 1000 x 5 chunk sizes on the chunked arm, both
  # against `tests/ref_f64_broad.bin` at 1e-3 RELATIVE. It was RED
  # (max_diff 7.90e-3 against EPSILON 5e-4, 1000/1000) because the fixture it
  # read was stale: `0a6998a` fixed the conv pad in `src/short_conv.rs` and the
  # f32 self-transcription still had the old padding in it. Regenerating it
  # would have re-committed the bug as the truth. This job is the gate and it
  # stays.
  oracle-breadth:
    name: "fused-lib :: 1000 cases vs the f64 oracle, fused-recurrent and 5 chunk sizes"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vendor/dormouse-fused
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/dormouse-fused
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      # --release: the 1000-case scan is minutes in an opt-0 build.
      - name: burn-gdn2, fused recurrent and chunked, vs the f64 oracle
        run: cargo test --release -p burn-gdn2 --features binary-tests --test oracle_breadth --test oracle_chunk

  # 5. cuda compiles, on a CPU runner
  cuda-compiles:
    name: "fused-lib :: cuda feature compiles (the M4 class: a cuda build that no longer builds)"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vendor/dormouse-fused
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/dormouse-fused
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      # DERIVED, not written here, and the old hand-written list was wrong in two
      # ways that each killed the step: it named `burn-mor`, which declares no
      # `cuda` feature, and it asked `cuda,autodiff` of burn-muon-plus,
      # burn-rmsnorm, burn-spectral and burn-swiglu, which declare no `autodiff`.
      # Cargo REJECTS a feature a package does not have - the old comment called it
      # "a silent no-op", and that belief is why the loop died on its fourth
      # crate and the nine behind it were never compiled at all.
      # `tools/gen_facade.py --cuda-matrix` reads every member manifest and prints
      # only combinations that exist: 12 crates, 20 combinations today.
      # `--all-targets` rather than `cargo test --no-run`: this job's own comment
      # says what it is ("the crate COMPILES and cannot fail on a CUDA-only bug"),
      # `--all-targets` covers lib + tests + examples + benches, and it does not
      # spend the step linking 20 test binaries to prove the same thing.
      - name: every cuda crate, every combination it declares, all targets
        run: |
          set -euo pipefail
          python3 tools/gen_facade.py --cuda-matrix | while read -r c f; do
            echo "== $c [$f]"
            cargo check -p "$c" --features "$f" --all-targets
          done
      - name: the GPU probe packages build
        run: |
          cargo check -p burn-fused-benches
          cargo check -p cpu-probe
          cargo check -p launch-probe

  # There is deliberately NO cuda-tests job here.
  #
  # There used to be one: `cuda-tests` on `runs-on: [self-hosted, gpu, linux]`,
  # with a comment admitting no runner was registered. It never ran. Its
  # `cuda-compiles` sibling only does `--no-run`, which proves the crate COMPILES
  # and cannot fail on a CUDA-only bug — so every GPU-only claim in this library
  # was unverified, which is how the fused gated-delta dispatch gate stayed
  # dead for a year. A job that advertises a check which never fires is worse
  # than no job: it is read as a gate.
  #
  # A runner was not registered instead, on purpose. This workstation is the
  # only GPU in the project's life, and it is simultaneously the trainer (a
  # resumed 48M-slot run holds ~37 GB), the benchmark box, and the agent
  # workstation. A GitHub runner polling it would accept a release CUDA build
  # next to that training run and get OOM-killed by `ram-guard`, going red for
  # reasons that have nothing to do with the diff — a gate that is red half the
  # time teaches people to re-run it, which is a decoration with a status light.
  # Registering a runner also means minting a registration token against the
  # owner's repo, which is the owner's call, not a code change's.
  #
  # So the GPU check is a command a contributor runs on the GPU box, and it is
  # a real one — it compiles AND runs AND reports per test:
  #
  #     vendor/dormouse-fused/tools/gpu-gate.sh
  #
  # It refuses to pass without a visible CUDA device, sets BURN_DEVICE=cuda so
  # the `if env::var("BURN_DEVICE") != "cuda" { return; }` guards cannot report
  # PASS having asserted nothing, and fails if the test count is not what it
  # expects. `burn-fused/tests/gpu_production_shape.rs` is the assertion: the
  # gated-delta chunk path at the shape dormouse trains (batch 10, seq 512,
  # 12 heads x 64) through `Autodiff<CudaBare, BalancedCheckpointing>`, the
  # trainer's backend, asserting the fused forward AND adjoint kernels LAUNCHED
  # (launch counters, not numbers — a fallback computes the same function).
  # What the gate does not yet cover is listed at the end of the script.
