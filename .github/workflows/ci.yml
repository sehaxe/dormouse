name: ci

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: lib tests (core + data + train)
        run: cargo test -p dormouse-core -p dormouse-data -p dormouse-train --lib
      - name: model seam tests
        run: cargo test -p dormouse-core --test model_seam
      - name: cli
        run: cargo check -p dormouse-cli

  # compile-only: catches cuda-feature breakages (the M4 class of regression)
  # without needing a GPU runner. Flip continue-on-error off once green.
  cuda-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: cuda feature compile check (no GPU required)
        run: cargo check -p dormouse-core -p dormouse-train --features dormouse-train/cuda
        env:
          CUDARC_CUDA_VERSION: "12050"

  # ── 1. lint ────────────────────────────────────────────────────────────────
  # rustfmt + clippy on the crates this workflow already builds. Nothing here
  # needs a GPU, so nothing here enables a cuda feature.
  #
  # BOTH STEPS ARE RED ON LANDING AND BOTH ARE RED ON PURPOSE, with the count
  # measured on this box, rustc/rustfmt/clippy 1.98.1, 2026-10-01 (full list:
  # docs/reviews/ci-quality-2026-10-01.md):
  #
  #   fmt     629 hunks across 54 files in the four crates (`cargo fmt -p ...`)
  #   clippy  114 unique diagnostics: 18 clippy lints + 4 rustc lints
  #
  # `continue-on-error: true`, and that is the finding, not a hedge. A gate
  # that is red on its first run and stays red until 629 formatting hunks are
  # fixed is a gate nobody reads — the exact decoration AGENTS.md §1.1 calls a
  # defect and fused-library.yml's header calls "a decoration with a status
  # light". The number is the deliverable; the fix is `cargo fmt` and a
  # `clippy --fix` pass, both of which are mechanical and belong in their own
  # commits, not folded into a CI change.
  #
  # `continue-on-error` is on the JOB, not on the steps, and that placement is
  # load-bearing. Measured on run 36866436388 (2026-10-01): with it on the
  # steps, GitHub reported BOTH failing steps as `conclusion: success` — a
  # green tick beside a red gate, which is the decoration the paragraph above
  # claims to be avoiding. On the job, each step keeps its own `failure` and
  # the run is not blocked. Same shape as the `cuda-compile` job above.
  #
  # TO CLOSE fmt: run `cargo fmt -p dormouse-core -p dormouse-data
  # -p dormouse-train -p dormouse-cli` in one commit and delete
  # `continue-on-error` on this JOB.
  # TO CLOSE clippy: same, with `cargo clippy --fix`, then work the 24 the
  # autofixer cannot (the ones with a per-file list in the findings file).
  lint:
    name: "core :: rustfmt + clippy (measured 2026-10-01: 629 fmt hunks, 114 clippy diagnostics)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        # `-p` on the four crates, NOT `--all`: `cargo fmt --all` also walks
        # local path-based dependencies, so it reaches the 279 unformatted
        # files inside vendor/dormouse-fused, which are a different workspace with
        # their own gate (fused-library.yml) and upstream's formatting is
        # deliberately preserved (.editorconfig). Naming the crates here keeps
        # this job's number about this repo's code.
        run: |
          cargo fmt -p dormouse-core -p dormouse-data -p dormouse-train -p dormouse-cli -- --check
      - name: clippy
        # `!cancelled()` and not the default `success()`: run 36868694110
        # measured what the default does here - rustfmt fails, and every step
        # after it is SKIPPED, so the clippy half of this job never reported at
        # all. That is the fused-library.yml failure mode by another route: a
        # gate that does not run is indistinguishable from a gate that passes.
        # `!cancelled()` still refuses to run on a cancelled job.
        if: ${{ !cancelled() }}
        run: |
          cargo clippy -p dormouse-core -p dormouse-data -p dormouse-train -p dormouse-cli --all-targets -- -D warnings

  # ── 2. supply-chain ────────────────────────────────────────────────────────
  # Advisories, licenses, duplicate versions, and where dependencies come from.
  # The policy is deny.toml at the repo root; this job is the only thing that
  # reads it, which is the point — a policy file nothing runs is a document.
  #
  # GREEN on landing, 2026-10-01, after two lockfile bumps this job forced:
  #   RUSTSEC-2026-0285  rustls 0.23.43 -> 0.23.45   (TLS 1.3 record boundary)
  #   yanked             chacha20 0.10.1 -> 0.10.2   (via rand 0.10 -> burn)
  # Both are transitive (rustls via ureq in tracel-llvm-bundler's BUILD deps,
  # chacha20 via rand 0.10 pulled by burn-backend), so neither is a decision
  # about our code; they were two `cargo update --precise` lines and the whole
  # diff is four lines of Cargo.lock.
  #
  # `bans.multiple-versions` (43 crates carry more than one version) and
  # `bans.wildcards` are `warn` on first landing with the reasons and the
  # closing recipe in deny.toml. Both are COUNTED, not silent: the count is in
  # the job log and in docs/reviews/ci-quality-2026-10-01.md.
  supply-chain:
    name: "supply chain :: advisories, licenses, sources, duplicates (green 2026-10-01)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The official action, which pins cargo-deny 0.20.2 inside its own
      # image. No rust toolchain step: the action's container carries its own,
      # and it only runs `cargo metadata` — nothing here compiles.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # `--all-features` is the default and it is load-bearing here: the
          # cuda feature's edges (cubecl-cuda, cublas, cudarc) are only in the
          # graph when it is on, so without it this job would certify a graph
          # the trainer never builds.
          arguments: --all-features
          manifest-path: ./Cargo.toml
          log-level: warn

  # ── 3. unused-deps ─────────────────────────────────────────────────────────
  # Dependencies declared in a manifest and referenced by no source line.
  # The failure mode is not "dead code" — it is a manifest that lies about what
  # the crate needs, so a dependency bump changes a build nobody re-tests.
  #
  # WARN-ONLY on landing: 10 findings in this repo's own crates, measured
  # 2026-10-01 (`cargo machete crates/`), listed in
  # docs/reviews/ci-quality-2026-10-01.md. Four of the six are cargo-machete's
  # known blind spot, not real findings: `burn-tensor` / `burn-nn` /
  # `burn-cuda` are reached through the `burn` facade re-export
  # (`use burn::tensor::…`), which a literal grep for `burn_tensor` cannot see.
  # `rand` in dormouse-core/dormouse-train is real — the `--rand-depth` arm
  # lives in dormouse-train/src/cfg.rs and uses no RNG. The remaining three
  # (`serde_json`, `dormouse-data`, `burn` in dormouse-cli) are real too and
  # are a one-line deletion each.
  #
  # TO CLOSE: delete the three real entries in dormouse-cli, add
  # `[package.metadata.cargo-machete] ignored = [...]` for the four facade
  # re-exports with that reason, then drop `continue-on-error`.
  unused-deps:
    name: "unused deps :: cargo-machete, warn-only (10 findings in crates/, 4 of them facade false positives)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 0.9.2 is the current release and the one this repo's findings were
      # measured with (2026-10-01). `fallback: none` means the job FAILS if
      # the prebuilt binary is unavailable rather than quietly compiling the
      # tool from source - a version that drifts under a gate is the ADR-0019
      # SILENT shape. The action verifies the release's SHA256.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
          fallback: none
      # `crates/` not the repo root: bare `cargo machete` also walks
      # vendor/dormouse-fused's 20 crates and their benches, which are a separate
      # workspace with their own workflow.
      - name: unused dependencies
        run: cargo machete crates/

  # ── 4. coverage ────────────────────────────────────────────────────────────
  # How much of the three library crates the lib test suites actually execute.
  # `--lib` and not the whole workspace: the seam tests under crates/*/tests/
  # are separate binaries and folding them in would answer a different question
  # ("what do the unit tests cover") than the one this number is for ("how much
  # of the library does `cargo test --lib` reach").
  #
  # NO THRESHOLD, ON PURPOSE, and the number is printed so the threshold can be
  # chosen from a measurement instead of a guess: a floor invented before the
  # first reading is a floor nobody can satisfy or defend. What this job buys
  # today is the lcov artifact and the number in the log, both of which turn
  # "coverage fell" from an opinion into a diff on the next run. See the
  # coverage row in docs/reviews/ci-quality-2026-10-01.md for the reading this
  # landed with and where the untested mass is.
  #
  # The instrumented build is a SEPARATE target directory (cargo-llvm-cov's
  # default, `target/llvm-cov-target`), so it never invalidates the plain
  # `target/` the other jobs share, and Swatinem/rust-cache's default key does
  # not cover it - which is the trade: this job pays a full cold build of the
  # dependency tree on every run.
  coverage:
    name: "coverage :: llvm-cov over the three lib test suites (measurement, no gate yet)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview is what supplies `llvm-profdata`/`llvm-cov` for
          # this toolchain; without the component cargo-llvm-cov refuses to
          # start rather than measuring nothing.
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # coverage instrumentation links the test binaries, and this repo's
      # .cargo/config.toml sets `-C link-arg=-fuse-ld=mold` for
      # x86_64-unknown-linux-gnu, so without mold every link fails with
      # collect2's "cannot find ld". Same step, same reason, as the cpu job.
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      # 0.9.1 is the current release; `fallback: none` makes a missing prebuilt
      # binary a failure instead of a silent source build of an unmeasured
      # version. The action checks the release's SHA256.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: instrument, run the three lib suites, report
        run: |
          cargo llvm-cov --lib -p dormouse-core -p dormouse-data -p dormouse-train \
            --summary-only --lcov --output-path lcov.info
      - name: the number, in the log
        # Re-print the TOTAL out of the lcov file rather than trusting that the
        # table above scrolled past. lcov's per-file records carry `LF:<lines
        # found>` and `LH:<lines hit>`; summing both across records gives the
        # number, and the file is the artifact - so the two cannot disagree.
        run: |
          awk -F: '
            /^LF:/ { found += $2 }
            /^LH:/ { hit += $2 }
            END { printf "coverage: %d/%d lines = %.2f%%\n", hit, found, 100 * hit / found }
          ' lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 30

  # ── 5. docs ────────────────────────────────────────────────────────────────
  # rustdoc builds. `broken_intra_doc_links = "deny"` and
  # `invalid_html_tags = "deny"` already live in the root `[workspace.lints.
  # rustdoc]` table and every member opts in with `[lints] workspace = true`,
  # so this job's real content is not the build - it is that a doc link which
  # does not resolve is now a BUILD FAILURE anywhere a crate is built, and this
  # is the job that shows it.
  #
  # dormouse-train is NOT here: it is the heavy crate, it has an active lane,
  # and adding it is a one-line change when that lane lands. Naming the
  # omission is the point - a gate that silently covers three of four crates
  # reads as coverage of four.
  #
  # GREEN on landing 2026-10-01 (`cargo doc --no-deps -p dormouse-core
  # -p dormouse-data -p dormouse-cli`, rustc 1.98.1): 57 s, exit 0, 7 rustdoc
  # `missing documentation` warnings from the two lint tables above and nothing
  # denied. Those warnings are NOT a gate and deliberately so: `missing_docs`
  # is a style lint, and this repo's docs are in AGENTS.md / docs/ rather than
  # in per-item rustdoc. See docs/reviews/ci-quality-2026-10-01.md.
  #
  # NOT HERE: the docs-site build. It is already a job - `build` in
  # docs-site.yml, running `npm ci && npm run ingest && npm run build
  # && npm run check` and failing on any dead internal href. Adding it here
  # would build the same 151-page site twice on every push to main. What that
  # job does NOT cover is recorded in the findings file: its `paths:` filter
  # means a PR that only touches a crate's doc comments runs no docs gate at
  # all, because the filter names docs paths and not `crates/**`.
  docs:
    name: "docs :: rustdoc for core + data + cli (a doc link that does not resolve is a build failure)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: rustdoc
        run: cargo doc --no-deps -p dormouse-core -p dormouse-data -p dormouse-cli

  # ── 6. workflow-lint ───────────────────────────────────────────────────────
  # The fuse for the failure this file has already had once. `ae0505d` is the
  # record: an unquoted colon inside a `name:` scalar ("the facade: generated
  # files in sync...") made fused-library.yml a YAML parse error, so the whole
  # workflow silently stopped running - five jobs, including the 1000-case
  # f64 oracle gate, contributed nothing and nothing said so. The fix was one
  # pair of quote characters and it was found by reading, after the fact.
  #
  # actionlint catches that class (yaml parse, expression syntax, context
  # typos, shellcheck on every `run:`) and it costs ~3 s with no toolchain.
  # GREEN on landing 2026-10-01: actionlint 1.7.12 over all three workflow files
  # reports zero findings, which is the first machine check these files have
  # ever passed.
  #
  # Pinned: version 1.7.12, and the download is verified against that release's
  # published SHA256 (linux_amd64 8aca8db9..., the runner image's platform).
  # `shellcheck` and `pyflakes` are installed alongside because actionlint uses
  # them when present and silently checks less when they are not - the same
  # silent-degradation shape as the ADR-0019 failure mode, in a linter.
  #
  # Runs on EVERY push, not on a paths filter: the file this job protects is
  # the file that decides what runs, so "only when the workflows changed" is a
  # filter that can be wrong in the same commit that breaks it.
  workflow-lint:
    name: "ci :: actionlint on every workflow file (the unquoted-colon outage, as a gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # actionlint drives two external checkers and silently skips either one
      # that is missing (measured, see the last step). shellcheck is an apt
      # package on the runner image; pyflakes is NOT - it is a PyPI package and
      # `apt-get install pyflakes` fails the whole step, which is how this job's
      # own first run went red. `pipx` is preinstalled on ubuntu-latest, so it
      # is the shortest correct install and it pins nothing that apt would.
      - name: the checkers actionlint drives
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install pyflakes
      - name: actionlint 1.7.12 (sha256-verified)
        run: |
          set -euo pipefail
          version=1.7.12
          asset="actionlint_${version}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -fsSL -o "$asset" "$base/$asset"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $asset" | sha256sum -c -
          tar -xzf "$asset" actionlint
          ./actionlint --version
      - name: every workflow file in this repo
        # No path arguments: actionlint then lints .github/workflows/*.y*ml, and
        # naming them by hand is how a new workflow escapes the gate.
        run: ./actionlint
      - name: "shellcheck was on PATH, or the run: bodies went unchecked"
        # actionlint finds an absent checker SILENTLY: measured on 1.7.12 here,
        # a workflow with `run: echo $HOME` reports SC2086 when shellcheck is
        # on PATH and reports NOTHING - not a note, not an error, same exit
        # code - when it is not. So a green actionlint run cannot distinguish
        # "every run: body is shellchecked" from "no run: body was ever
        # checked", which is the ADR-0019 SILENT shape living inside a linter.
        # The check is therefore explicit: actionlint resolves both checkers
        # off PATH, so proving they are on PATH in this step proves the bodies
        # were linted. pyflakes is here for `shell: python` run bodies, of
        # which this repo currently has none - it is installed so that adding
        # one does not silently add zero checking.
        run: |
          set -euo pipefail
          command -v shellcheck
          shellcheck --version | head -2
          command -v pyflakes
          pyflakes --version
