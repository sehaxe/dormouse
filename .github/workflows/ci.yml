name: ci

on:
  push:
  pull_request:

jobs:
  # The Python tree: lint, then the full CPU suite. The CUDA gates self-skip on
  # a runner without a GPU (they check for the device, not for CI), so the same
  # 861 tests that run locally run here minus the hardware-bound ones.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install (CPU torch from PyPI; the gpu extra is the local stack)
        run: uv sync
      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: tests
        run: CUDA_VISIBLE_DEVICES="" uv run pytest

  # The docs gate: every repo path a tracked document names must exist. Cheap
  # (stdlib only, no install) and it is the check that catches a rename that
  # rewrote links into lies - see tools/check_doc_refs.py for why it exists.
  doc-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_doc_refs.py
