name: ci

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: lib tests (core + data + train)
        run: cargo test -p dormouse-core -p dormouse-data -p dormouse-train --lib
      - name: model seam tests
        run: cargo test -p dormouse-core --test model_seam
      - name: cli
        run: cargo check -p dormouse-cli

  # compile-only: catches cuda-feature breakages (the M4 class of regression)
  # without needing a GPU runner. Flip continue-on-error off once green.
  cuda-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      - name: cuda feature compile check (no GPU required)
        run: cargo check -p dormouse-core -p dormouse-train --features dormouse-train/cuda
        env:
          CUDARC_CUDA_VERSION: "12050"

  # ── 1. lint ────────────────────────────────────────────────────────────────
  # rustfmt + clippy on the crates this workflow already builds. Nothing here
  # needs a GPU, so nothing here enables a cuda feature.
  #
  # BOTH STEPS ARE RED ON LANDING AND BOTH ARE RED ON PURPOSE, with the count
  # measured on this box, rustc/rustfmt/clippy 1.98.1, 2026-10-01 (full list:
  # docs/reviews/ci-quality-2026-10-01.md):
  #
  #   fmt     651 hunks across 54 files in the four crates (`cargo fmt -p ...`)
  #   clippy  114 unique diagnostics: 18 clippy lints + 4 rustc lints
  #
  # `continue-on-error: true` on both, and that is the finding, not a hedge. A
  # gate that is red on its first run and stays red until 651 formatting hunks
  # are fixed is a gate nobody reads — the exact decoration AGENTS.md §1.1
  # calls a defect and fused-library.yml's header calls "a decoration with a
  # status light". The number is the deliverable; the fix is `cargo fmt` and a
  # `clippy --fix` pass, both of which are mechanical and belong in their own
  # commits, not folded into a CI change.
  #
  # TO CLOSE fmt: run `cargo fmt -p dormouse-core -p dormouse-data
  # -p dormouse-train -p dormouse-cli` in one commit and delete
  # `continue-on-error` on that step.
  # TO CLOSE clippy: same, with `cargo clippy --fix`, then work the 24 the
  # autofixer cannot (the ones with a per-file list in the findings file).
  lint:
    name: "core :: rustfmt + clippy (measured 2026-10-01: 651 fmt hunks, 114 clippy diagnostics)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        # `-p` on the four crates, NOT `--all`: `cargo fmt --all` also walks
        # local path-based dependencies, so it reaches the 279 unformatted
        # files inside vendor/burn-fused, which are a different workspace with
        # their own gate (fused-library.yml) and upstream's formatting is
        # deliberately preserved (.editorconfig). Naming the crates here keeps
        # this job's number about this repo's code.
        continue-on-error: true
        run: |
          cargo fmt -p dormouse-core -p dormouse-data -p dormouse-train -p dormouse-cli -- --check
      - name: clippy
        continue-on-error: true
        run: |
          cargo clippy -p dormouse-core -p dormouse-data -p dormouse-train -p dormouse-cli --all-targets -- -D warnings

  # ── 2. supply-chain ────────────────────────────────────────────────────────
  # Advisories, licenses, duplicate versions, and where dependencies come from.
  # The policy is deny.toml at the repo root; this job is the only thing that
  # reads it, which is the point — a policy file nothing runs is a document.
  #
  # GREEN on landing, 2026-10-01, after two lockfile bumps this job forced:
  #   RUSTSEC-2026-0285  rustls 0.23.43 -> 0.23.45   (TLS 1.3 record boundary)
  #   yanked             chacha20 0.10.1 -> 0.10.2   (via rand 0.10 -> burn)
  # Both are transitive (rustls via ureq in tracel-llvm-bundler's BUILD deps,
  # chacha20 via rand 0.10 pulled by burn-backend), so neither is a decision
  # about our code; they were two `cargo update --precise` lines and the whole
  # diff is four lines of Cargo.lock.
  #
  # `bans.multiple-versions` (43 crates carry more than one version) and
  # `bans.wildcards` are `warn` on first landing with the reasons and the
  # closing recipe in deny.toml. Both are COUNTED, not silent: the count is in
  # the job log and in docs/reviews/ci-quality-2026-10-01.md.
  supply-chain:
    name: "supply chain :: advisories, licenses, sources, duplicates (green 2026-10-01)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The official action, which pins cargo-deny 0.20.2 inside its own
      # image. No rust toolchain step: the action's container carries its own,
      # and it only runs `cargo metadata` — nothing here compiles.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # `--all-features` is the default and it is load-bearing here: the
          # cuda feature's edges (cubecl-cuda, cublas, cudarc) are only in the
          # graph when it is on, so without it this job would certify a graph
          # the trainer never builds.
          arguments: --all-features
          manifest-path: ./Cargo.toml
          log-level: warn

  # ── 3. unused-deps ─────────────────────────────────────────────────────────
  # Dependencies declared in a manifest and referenced by no source line.
  # The failure mode is not "dead code" — it is a manifest that lies about what
  # the crate needs, so a dependency bump changes a build nobody re-tests.
  #
  # WARN-ONLY on landing: 10 findings in this repo's own crates, measured
  # 2026-10-01 (`cargo machete crates/`), listed in
  # docs/reviews/ci-quality-2026-10-01.md. Four of the six are cargo-machete's
  # known blind spot, not real findings: `burn-tensor` / `burn-nn` /
  # `burn-cuda` are reached through the `burn` facade re-export
  # (`use burn::tensor::…`), which a literal grep for `burn_tensor` cannot see.
  # `rand` in dormouse-core/dormouse-train is real — the `--rand-depth` arm
  # lives in dormouse-train/src/cfg.rs and uses no RNG. The remaining three
  # (`serde_json`, `dormouse-data`, `burn` in dormouse-cli) are real too and
  # are a one-line deletion each.
  #
  # TO CLOSE: delete the three real entries in dormouse-cli, add
  # `[package.metadata.cargo-machete] ignored = [...]` for the four facade
  # re-exports with that reason, then drop `continue-on-error`.
  unused-deps:
    name: "unused deps :: cargo-machete, warn-only (10 findings in crates/, 4 of them facade false positives)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 0.9.2 is the current release and the one this repo's findings were
      # measured with (2026-10-01). `fallback: none` means the job FAILS if
      # the prebuilt binary is unavailable rather than quietly compiling the
      # tool from source - a version that drifts under a gate is the ADR-0019
      # SILENT shape. The action verifies the release's SHA256.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
          fallback: none
      # `crates/` not the repo root: bare `cargo machete` also walks
      # vendor/burn-fused's 20 crates and their benches, which are a separate
      # workspace with their own workflow.
      - name: unused dependencies
        continue-on-error: true
        run: cargo machete crates/

  # ── 4. coverage ────────────────────────────────────────────────────────────
  # How much of the three library crates the lib test suites actually execute.
  # `--lib` and not the whole workspace: the seam tests under crates/*/tests/
  # are separate binaries and folding them in would answer a different question
  # ("what do the unit tests cover") than the one this number is for ("how much
  # of the library does `cargo test --lib` reach").
  #
  # NO THRESHOLD, ON PURPOSE, and the number is printed so the threshold can be
  # chosen from a measurement instead of a guess: a floor invented before the
  # first reading is a floor nobody can satisfy or defend. What this job buys
  # today is the lcov artifact and the number in the log, both of which turn
  # "coverage fell" from an opinion into a diff on the next run. See the
  # coverage row in docs/reviews/ci-quality-2026-10-01.md for the reading this
  # landed with and where the untested mass is.
  #
  # The instrumented build is a SEPARATE target directory (cargo-llvm-cov's
  # default, `target/llvm-cov-target`), so it never invalidates the plain
  # `target/` the other jobs share, and Swatinem/rust-cache's default key does
  # not cover it - which is the trade: this job pays a full cold build of the
  # dependency tree on every run.
  coverage:
    name: "coverage :: llvm-cov over the three lib test suites (measurement, no gate yet)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # llvm-tools-preview is what supplies `llvm-profdata`/`llvm-cov` for
          # this toolchain; without the component cargo-llvm-cov refuses to
          # start rather than measuring nothing.
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # coverage instrumentation links the test binaries, and this repo's
      # .cargo/config.toml sets `-C link-arg=-fuse-ld=mold` for
      # x86_64-unknown-linux-gnu, so without mold every link fails with
      # collect2's "cannot find ld". Same step, same reason, as the cpu job.
      - name: install mold (repo config links through it)
        run: sudo apt-get update && sudo apt-get install -y mold
      # 0.9.1 is the current release; `fallback: none` makes a missing prebuilt
      # binary a failure instead of a silent source build of an unmeasured
      # version. The action checks the release's SHA256.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - name: instrument, run the three lib suites, report
        run: |
          cargo llvm-cov --lib -p dormouse-core -p dormouse-data -p dormouse-train \
            --summary-only --lcov --output-path lcov.info
      - name: the number, in the log
        # Re-print the TOTAL out of the lcov file rather than trusting that the
        # table above scrolled past. lcov's per-file records carry `LF:<lines
        # found>` and `LH:<lines hit>`; summing both across records gives the
        # number, and the file is the artifact - so the two cannot disagree.
        run: |
          awk -F: '
            /^LF:/ { found += $2 }
            /^LH:/ { hit += $2 }
            END { printf "coverage: %d/%d lines = %.2f%%\n", hit, found, 100 * hit / found }
          ' lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 30
