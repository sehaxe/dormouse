name: ci

# WHAT THIS FILE GATES, 2026-11-13.
#
# The live lane is `port/` (Python 3.12, uv, pytest, ruff): every training run,
# every architecture A/B and every post-training path lands there. It is what
# every job in the first half of this file exercises, and a red job there
# blocks main.
#
# One lane. The Rust/burn tree and the vendored fused-kernel library live on
# the `rust-lane` branch (pushed 2026-11-13, history intact); `main` is the
# Python lane only, so nothing here compiles Rust and nothing here can go red
# on a cargo feature that does not matter to the product.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege for every job: a PR runs repo code (pytest, ruff, the docs
# gates), so the token must not be able to push.
permissions:
  contents: read

# The one split that both pytest jobs use: `python-test` runs `not pins`,
# `pins` runs the marker. Collected 2026-11-13: 2500 outside, 82 inside, 2582
# total — a partition by behaviour (a test that compares an exact sha256,
# state_dict or launch-count fingerprint), not a name heuristic.

jobs:
  # ── python lane ────────────────────────────────────────────────────────────
  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: install (frozen)
        run: cd port && uv sync --frozen
      - name: ruff check
        run: cd port && uv run ruff check src scripts tests
      - name: ruff format (changed files only until the sweep lands)
        run: bash scripts/gate_format.sh --changed origin/${{ github.base_ref || 'main' }}

  # The suite, minus the sha256 pins. The pins are valuable — "the off path must
  # be bit-identical" is the only test that catches a flag silently becoming a
  # formula — but they legitimately move on every change, so they cannot be a
  # landing gate.
  #
  # MEASURED 2026-11-13 on the 82 failures of run 42480254891: the names are
  # NOT uniform (`test_gate_1_csa_off_is_bit_identical_to_main`,
  # `test_jepa_off_is_the_pre_change_model_bit_for_bit`,
  # `test_the_default_path_is_byte_identical`, ...), and only 6 contain "pin"
  # and 2 contain "hash" — `-k "not pin and not hash"` alone would have left 74
  # red. This selector catches 71 of the 82. The durable fix is a `pins` marker
  # in `port/pyproject.toml` (`-m "not pins"`), which is the port lane's file.
  # Until then the residual is named, not hidden: a pin that dodges the selector
  # reds this job and its name gets added to PIN_SELECTOR.
  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install (frozen)
        run: cd port && uv sync --frozen
      # The dev box keeps scratch files in /tmp/opencode and two tests write
      # there by absolute path (`test_bank_invalidation`, `test_moe_bank_cache`),
      # which is a FileNotFoundError on a runner. Creating the directory is the
      # CI-side fix; the durable one is `tmp_path` (port/tests, port lane).
      - name: scratch dir the tests hardcode
        run: mkdir -p /tmp/opencode
      - name: pytest (CPU)
        run: cd port && PYTHONPATH=$PWD/src uv run python -m pytest -q -p no:logging -m "not pins"

  # Report-only ON PURPOSE. The pins are the project's own contract that a
  # disabled arm changes nothing; they break on every legitimate change and
  # are the honest cost of that contract, not a defect. Never a gate until the
  # `pins` marker exists.
  pins:
    name: "pins (informational) :: exact sha256/state_dict/launch fingerprints"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install (frozen)
        run: cd port && uv sync --frozen
      - name: pytest (the pins)
        run: cd port && PYTHONPATH=$PWD/src uv run python -m pytest -q -p no:logging -m pins

  python-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The doc-refs gate proves provenance with `sha:path` references, so the
      # job needs the history to resolve them: at depth 1 those blobs are absent
      # and a real, verifiable reference reads as a missing file.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: install (frozen)
        run: cd port && uv sync --frozen
      - name: doc references
        run: python3 tools/check_doc_refs.py
      - name: dead knobs (a preset must not set a field nothing reads)
        run: |
          cd port
          PYTHONPATH=src uv run python scripts/dead_knob_audit.py --preset-glob 'configs/**/*.toml' > /tmp/dead_knobs.txt 2>&1 || rc=$?
          rc=${rc:-0}; tail -5 /tmp/dead_knobs.txt
          test "$rc" -ne 2

  # ── the claims ledger ──────────────────────────────────────────────────────
  # Report-only ON PURPOSE, and the debt is named: 1 901 legacy claims predate
  # the rule, 9 mismatch, and the gate cannot pass until they are converted
  # (`.bulba/plan.md`). A blocking job here would freeze every push on a
  # backlog; a silent one would hide it. So: run it, publish the count, fail
  # only if the SCRIPT crashes.
  claims-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install (frozen)
        run: cd port && uv sync --frozen
      - name: ledger (report)
        run: |
          cd port && PYTHONPATH=src uv run python scripts/claims_ledger.py \
            --docs ../docs --repo .. --no-params --today "$(date -u +%F)" \
            --out /tmp/ledger.md | tail -2
          tail -20 /tmp/ledger.md

  # ── the landing page ───────────────────────────────────────────────────────
  # `site/index.html` is hand-written now (`site/gen`, the Rust generator, is
  # frozen), so this job builds nothing: it checks the page that is about to be
  # published. The old version ran `cargo build` in `site/gen` and died at
  # "cannot find 'ld'" — `.cargo/config.toml` links through mold, the runner had
  # no mold, and the page was never checked at all.
  #
  # Four cheap checks, one python process, seconds not minutes:
  #   1. the file exists and is not empty;
  #   2. it parses, and no element is left OPEN at EOF — an unclosed <div>
  #      swallows every section after it, which is the way a hand-written page
  #      rots. A STRAY end tag is counted, not fatal: browsers drop it and the
  #      page renders, so a gate on it would red the build for a typo that
  #      changes nothing (the page carries one today, reported in the log);
  #   3. no unbuilt generator placeholder (`__DATA__`/`__SURPRISE__`/
  #      `__SCRIPT__`) and no `TODO`/`FIXME`: the page is shipped copy;
  #   4. every relative `src`/`href`/`poster`/`content`/`url()` it names exists
  #      and is non-empty, so a renamed `.webm` cannot ship as a black rectangle.
  site:
    name: "site :: index.html parses, no placeholders/TODOs, every asset it names exists"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: site/index.html
        run: |
          python3 - <<'PY'
          import re
          import sys
          from html.parser import HTMLParser
          from pathlib import Path

          VOID = {"area", "base", "br", "col", "embed", "hr", "img", "input",
                  "link", "meta", "param", "source", "track", "wbr"}
          page = Path("site/index.html")
          if not page.is_file() or page.stat().st_size == 0:
              sys.exit("FAIL: site/index.html is missing or empty")
          src = page.read_text(encoding="utf-8")


          class Tags(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.stray = []

              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append((tag, self.getpos()[0]))

              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  names = [t for t, _ in self.stack]
                  if tag in names:
                      while self.stack.pop()[0] != tag:
                          pass
                  else:
                      self.stray.append((tag, self.getpos()[0]))


          parsed = Tags()
          parsed.feed(src)
          parsed.close()

          fails = []
          if "</html>" not in src:
              fails.append("no closing </html>")
          if parsed.stack:
              fails.append("unclosed at EOF: " + ", ".join(
                  f"<{t}> line {ln}" for t, ln in parsed.stack[:5]))
          if re.search(r"__DATA__|__SURPRISE__|__SCRIPT__", src):
              fails.append("an unbuilt generator placeholder is in the page")
          for marker in ("TODO", "FIXME"):
              if marker in src:
                  fails.append(f"{marker} in a page CI treats as shipped")

          refs = set(re.findall(
              r"""(?:src|href|poster)\s*=\s*["']([^"'#?]+)""", src))
          refs |= set(re.findall(r"""url\(\s*['"]?([^'")]+)""", src))
          missing = []
          for ref in sorted(refs):
              if ref.startswith(("http://", "https://", "mailto:", "data:", "//")):
                  continue
              if ref.endswith("/"):  # a directory route, e.g. href="docs/"
                  continue
              asset = Path("site") / ref
              if not asset.is_file() or asset.stat().st_size == 0:
                  missing.append(ref)
          if missing:
              fails.append("referenced assets missing/empty: " + ", ".join(missing))

          if fails:
              print("\n".join("FAIL: " + f for f in fails))
              sys.exit(1)
          print(f"site ok: {len(refs)} references resolved, "
                f"{len(parsed.stray)} stray end tag(s) (ignored by browsers)")
          if parsed.stray:
              print("  " + ", ".join(f"</{t}> line {ln}" for t, ln in parsed.stray[:5]))
          PY

  # ── workflow-lint ──────────────────────────────────────────────────────────
  # The fuse for the failure this file has already had once. `ae0505d` is the
  # record: an unquoted colon inside a `name:` scalar made fused-library.yml a
  # YAML parse error, so the whole workflow silently stopped running - five
  # jobs contributed nothing and nothing said so.
  #
  # actionlint catches that class (yaml parse, expression syntax, context
  # typos, shellcheck on every `run:`) and it costs ~3 s with no toolchain.
  # version 1.7.12, download verified against that release's published SHA256.
  # `shellcheck` and `pyflakes` are installed because actionlint uses them when
  # present and silently checks less when they are not.
  #
  # Runs on EVERY push, not on a paths filter: the file this job protects is the
  # file that decides what runs, so "only when the workflows changed" is a
  # filter that can be wrong in the same commit that breaks it.
  workflow-lint:
    name: "ci :: actionlint on every workflow file (the unquoted-colon outage, as a gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # shellcheck is an apt package on the runner image; pyflakes is NOT - it
      # is a PyPI package and `apt-get install pyflakes` fails the step, which
      # is how this job's own first run went red. `pipx` is preinstalled on
      # ubuntu-latest, so it is the shortest correct install.
      - name: the checkers actionlint drives
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          pipx install pyflakes
      - name: actionlint 1.7.12 (sha256-verified)
        run: |
          set -euo pipefail
          version=1.7.12
          asset="actionlint_${version}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -fsSL -o "$asset" "$base/$asset"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $asset" | sha256sum -c -
          tar -xzf "$asset" actionlint
          ./actionlint --version
      - name: every workflow file in this repo
        # No path arguments: actionlint then lints .github/workflows/*.y*ml, and
        # naming them by hand is how a new workflow escapes the gate.
        run: ./actionlint
      - name: "shellcheck was on PATH, or the run: bodies went unchecked"
        # actionlint finds an absent checker SILENTLY: measured on 1.7.12, a
        # workflow with `run: echo $HOME` reports SC2086 when shellcheck is on
        # PATH and reports NOTHING - not a note, not an error, same exit code -
        # when it is not. So a green actionlint run cannot distinguish "every
        # run: body is shellchecked" from "no run: body was ever checked". The
        # check is explicit: actionlint resolves both checkers off PATH.
        run: |
          set -euo pipefail
          command -v shellcheck
          shellcheck --version | head -2
          command -v pyflakes
          pyflakes --version
