name: docs-site

# The knowledge base, deployed. Two things ship together:
#
#   sehaxe.github.io/dormouse/        ← site/index.html, the product page
#   sehaxe.github.io/dormouse/docs/   ← this Astro Starlight app
#
# The docs are eight maintained pages. Everything else — the 240 reviews and
# research notes — is a record, indexed by date on /docs/archive/ and read on
# GitHub. It is deliberately not in the sidebar: a docs tree people cannot scan
# is a docs tree nobody reads.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'site/index.html'
      - 'site/pitch/**'
      - 'site/*.pdf'
      - 'site/media/**'
      - 'site/assets/**'
      - 'docs/HANDBOOK.md'
      - 'docs/records/reviews/**'
      - 'docs/records/research/**'
      - 'docs/adr/**'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: install
        working-directory: docs-site
        run: npm ci --no-audit --no-fund
      - name: build (syncs the handbook, indexes the archive, renders)
        working-directory: docs-site
        run: npm run build
      - name: landing at the root, docs under /docs
        run: |
          set -euo pipefail
          mkdir -p out/docs
          cp -r docs-site/dist/. out/docs/
          cp site/index.html out/index.html
          cp -r site/media out/media
          cp -r site/pitch out/pitch
          cp site/dormouse-pitch-*.pdf out/
          if [ -d site/assets ]; then cp -r site/assets out/assets; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
