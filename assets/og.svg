<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="dormouse — a byte-level Mixture-of-Experts language model trained on one consumer GPU">
  <!-- The social card. Deliberately sparse: a crawler shows this at 300-500px
       wide, so anything past a mark, a name, one line of what-it-is and one
       line of numbers is unreadable there. assets/og.svg is the source;
       docs-site/public/og.png is the rasterisation crawlers read (they do not
       read SVG), re-render it whenever this file changes.

       The mark and the name come from tools/mk_wordmark.py — the same glyphs as
       the nav, the favicon, the banner and the hero card, so the preview and
       the site are one identity. Rects, not <text>: a block character's advance
       width belongs to the reader's font. -->
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .ink { fill: #201d1d; }
      .body { fill: #424245; }
      .mute { fill: #646262; }
      .hair { stroke: rgba(15, 0, 0, 0.3); stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#fdfcfc" />
  <rect x="0.5" y="0.5" width="1199" height="629" class="hair" />

  <g class="mono">
    <!-- top rail -->
    <text x="64" y="86" font-size="19" class="mute">[+] byte-level moe &#183; no tokenizer &#183; one consumer gpu</text>
    <text x="1136" y="86" font-size="19" class="mute" text-anchor="end">$429</text>

    <!-- the logo, then the name -->
    <g fill="#201d1d" transform="translate(64 168)">
      <rect x="0" y="0" width="42" height="14"/>
      <rect x="0" y="14" width="14" height="14"/>
      <rect x="42" y="14" width="14" height="14"/>
      <rect x="0" y="28" width="14" height="14"/>
      <rect x="42" y="28" width="14" height="14"/>
      <rect x="0" y="42" width="14" height="14"/>
      <rect x="42" y="42" width="14" height="14"/>
      <rect x="0" y="56" width="42" height="14"/>
    </g>
    <g fill="#201d1d" transform="translate(152 178)">
      <rect x="0" y="0" width="30" height="10"/>
      <rect x="0" y="10" width="10" height="10"/>
      <rect x="30" y="10" width="10" height="10"/>
      <rect x="0" y="20" width="10" height="10"/>
      <rect x="30" y="20" width="10" height="10"/>
