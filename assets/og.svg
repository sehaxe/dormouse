      <rect x="360" y="20" width="40" height="10"/>
      <rect x="360" y="30" width="10" height="10"/>
      <rect x="370" y="40" width="30" height="10"/>
    </g>

    <!-- one line of what it is -->
    <text x="152" y="272" font-size="26" class="body">A byte-level Mixture-of-Experts language model,</text>
    <text x="152" y="306" font-size="26" class="body">trained end to end on one consumer GPU.</text>

    <!-- one rule, one line of numbers -->
    <rect x="64" y="396" width="1072" height="1" class="hair" />
    <text x="64" y="452" font-size="23" class="ink">1.07B total &#183; 57M active &#183; BPB 1.936 held-out &#183; 882 tests</text>
    <text x="64" y="496" font-size="23" class="mute">MIT license &#183; the whole pipeline on one RTX 5060 Ti</text>

    <!-- footer rail -->
    <text x="64" y="580" font-size="19" class="mute">sehaxe.github.io/dormouse</text>
    <text x="1136" y="580" font-size="19" class="mute" text-anchor="end">every number carries its measurement</text>
  </g>
</svg>
