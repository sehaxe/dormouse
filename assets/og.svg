<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="dormouse — a byte-level Mixture-of-Experts language model trained on one consumer GPU">
  <!-- The OpenGraph card (1200x630, the size crawlers crop to). Same design
       language as assets/banner.svg and the landing: warm cream canvas, near
       black ink, one hairline frame, ONE dark surface (the terminal card),
       everything monospaced. The committed PNG at docs-site/public/og.png is a
       rasterisation of THIS file (social crawlers do not read SVG); re-render
       it with any SVG rasteriser or a headless browser screenshot at 1200x630
       whenever the copy here changes. -->
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .ink { fill: #201d1d; }
      .body { fill: #424245; }
      .mute { fill: #646262; }
      .on-dark { fill: #fdfcfc; }
      .on-dark-mute { fill: #9a9898; }
      .hair { stroke: rgba(15, 0, 0, 0.12); stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#fdfcfc" />
  <rect x="0.5" y="0.5" width="1199" height="629" class="hair" />

  <g class="mono">
    <!-- top rail -->
    <text x="64" y="86" font-size="19" class="mute">[+] byte-level moe &#183; no tokenizer &#183; one consumer gpu</text>
    <text x="1136" y="86" font-size="19" class="mute" text-anchor="end">$429</text>

    <!-- wordmark -->
    <text x="60" y="228" font-size="124" font-weight="700" class="ink">dormouse</text>

    <!-- tagline -->
    <text x="64" y="292" font-size="27" class="body">A byte-level Mixture-of-Experts language model,</text>
    <text x="64" y="328" font-size="27" class="body">trained end to end on one consumer GPU.</text>

    <!-- the one dark surface -->
    <rect x="64" y="366" width="700" height="176" rx="6" fill="#201d1d" />
    <g fill="#fdfcfc" transform="translate(92 384)">
      <rect x="0" y="0" width="21" height="7"/>
      <rect x="0" y="7" width="7" height="7"/>
      <rect x="21" y="7" width="7" height="7"/>
      <rect x="0" y="14" width="7" height="7"/>
      <rect x="21" y="14" width="7" height="7"/>
      <rect x="0" y="21" width="7" height="7"/>
      <rect x="21" y="21" width="7" height="7"/>
      <rect x="0" y="28" width="21" height="7"/>
      <rect x="42" y="0" width="14" height="7"/>
      <rect x="35" y="7" width="7" height="7"/>
      <rect x="56" y="7" width="7" height="7"/>
      <rect x="35" y="14" width="7" height="7"/>
      <rect x="56" y="14" width="7" height="7"/>
      <rect x="35" y="21" width="7" height="7"/>
      <rect x="56" y="21" width="7" height="7"/>
      <rect x="42" y="28" width="14" height="7"/>
      <rect x="70" y="0" width="7" height="7"/>
      <rect x="84" y="0" width="14" height="7"/>
      <rect x="70" y="7" width="14" height="7"/>
      <rect x="70" y="14" width="7" height="7"/>
      <rect x="70" y="21" width="7" height="7"/>
      <rect x="70" y="28" width="7" height="7"/>
      <rect x="105" y="0" width="14" height="7"/>
      <rect x="126" y="0" width="14" height="7"/>
      <rect x="105" y="7" width="7" height="7"/>
      <rect x="119" y="7" width="7" height="7"/>
      <rect x="133" y="7" width="7" height="7"/>
      <rect x="105" y="14" width="7" height="7"/>
      <rect x="119" y="14" width="7" height="7"/>
      <rect x="133" y="14" width="7" height="7"/>
      <rect x="105" y="21" width="7" height="7"/>
      <rect x="119" y="21" width="7" height="7"/>
      <rect x="133" y="21" width="7" height="7"/>
      <rect x="105" y="28" width="7" height="7"/>
      <rect x="119" y="28" width="7" height="7"/>
      <rect x="133" y="28" width="7" height="7"/>
      <rect x="154" y="0" width="14" height="7"/>
      <rect x="147" y="7" width="7" height="7"/>
      <rect x="168" y="7" width="7" height="7"/>
      <rect x="147" y="14" width="7" height="7"/>
      <rect x="168" y="14" width="7" height="7"/>
      <rect x="147" y="21" width="7" height="7"/>
      <rect x="168" y="21" width="7" height="7"/>
      <rect x="154" y="28" width="14" height="7"/>
      <rect x="182" y="0" width="7" height="7"/>
      <rect x="203" y="0" width="7" height="7"/>
      <rect x="182" y="7" width="7" height="7"/>
      <rect x="203" y="7" width="7" height="7"/>
      <rect x="182" y="14" width="7" height="7"/>
      <rect x="203" y="14" width="7" height="7"/>
      <rect x="182" y="21" width="7" height="7"/>
      <rect x="203" y="21" width="7" height="7"/>
      <rect x="189" y="28" width="21" height="7"/>
      <rect x="224" y="0" width="21" height="7"/>
      <rect x="217" y="7" width="7" height="7"/>
      <rect x="224" y="14" width="14" height="7"/>
      <rect x="238" y="21" width="7" height="7"/>
      <rect x="217" y="28" width="21" height="7"/>
      <rect x="259" y="0" width="14" height="7"/>
      <rect x="252" y="7" width="7" height="7"/>
      <rect x="273" y="7" width="7" height="7"/>
      <rect x="252" y="14" width="28" height="7"/>
      <rect x="252" y="21" width="7" height="7"/>
      <rect x="259" y="28" width="21" height="7"/>
    </g>
    <text x="92" y="464" font-size="21" class="on-dark-mute">$ dormouse train medium --set seq_len=1024</text>
    <text x="92" y="496" font-size="21" class="on-dark">step=60000  loss=1.2130  bpb=1.936  40.9k tok/s</text>
    <text x="92" y="528" font-size="21" class="on-dark-mute">ready &#8212; one RTX 5060 Ti 16GB, $429</text>

    <!-- stat column -->
    <g font-size="24">
      <text x="820" y="404" class="ink"><tspan class="mute">[+] </tspan>1.07B total</text>
      <text x="820" y="446" class="ink"><tspan class="mute">[+] </tspan>57M active</text>
      <text x="820" y="488" class="ink"><tspan class="mute">[+] </tspan>BPB 1.936</text>
      <text x="820" y="530" class="ink"><tspan class="mute">[+] </tspan>882 tests</text>
    </g>

    <!-- The brand mark: the mini 'd' on the wordmark's own 5-row cell grid
         (tools/mk_wordmark.py) - the same glyph the favicon and the nav carry. -->
    <g fill="#201d1d" transform="translate(1080 430)">
      <rect x="0" y="0" width="27" height="9"/>
      <rect x="0" y="9" width="9" height="9"/>
      <rect x="27" y="9" width="9" height="9"/>
      <rect x="0" y="18" width="9" height="9"/>
      <rect x="27" y="18" width="9" height="9"/>
      <rect x="0" y="27" width="9" height="9"/>
      <rect x="27" y="27" width="9" height="9"/>
      <rect x="0" y="36" width="27" height="9"/>
    </g>

    <!-- footer rail -->
    <text x="64" y="590" font-size="19" class="mute">sehaxe.github.io/dormouse</text>
    <text x="1136" y="590" font-size="19" class="mute" text-anchor="end">every number carries its measurement</text>
  </g>
</svg>
