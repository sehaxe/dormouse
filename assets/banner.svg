<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="dormouse — a byte-level Mixture-of-Experts language model trained on one consumer GPU">
  <!-- The banner follows the same design language as the site: warm cream
       canvas, near-black ink, 1px hairlines, one dark surface (the terminal
       card), everything monospaced. Tokens from the opencode DESIGN.md. -->
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .ink { fill: #201d1d; }
      .body { fill: #424245; }
      .mute { fill: #646262; }
      .on-dark { fill: #fdfcfc; }
      .on-dark-mute { fill: #9a9898; }
      .hair { stroke: rgba(15, 0, 0, 0.12); stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="340" fill="#fdfcfc" />
  <rect x="0.5" y="0.5" width="1199" height="339" class="hair" />

  <g class="mono">
    <!-- top rail -->
    <text x="48" y="52" font-size="13" class="mute">[+] byte-level moe &#183; no tokenizer &#183; one consumer gpu</text>
    <text x="1152" y="52" font-size="13" class="mute" text-anchor="end">$429</text>

    <!-- wordmark -->
    <text x="46" y="132" font-size="68" font-weight="700" class="ink">dormouse</text>

    <!-- tagline -->
    <text x="48" y="172" font-size="16" class="body">A byte-level Mixture-of-Experts language model,</text>
    <text x="48" y="194" font-size="16" class="body">trained end to end on one consumer GPU.</text>

    <!-- the one dark surface: a terminal card -->
    <rect x="48" y="220" width="640" height="92" rx="4" fill="#201d1d" />
    <text x="66" y="248" font-size="13" class="on-dark-mute">$ dormouse train medium --set seq_len=1024</text>
    <text x="66" y="270" font-size="13" class="on-dark">step=60000  loss=1.2130  bpb=1.936  40.9k tok/s</text>
    <text x="66" y="292" font-size="13" class="on-dark-mute">ready &#8212; one RTX 5060 Ti 16GB, $429</text>

    <!-- stat column -->
    <g font-size="15">
      <text x="740" y="140" class="ink"><tspan class="mute">[+] </tspan>1.07B total &#183; 57M active</text>
      <text x="740" y="176" class="ink"><tspan class="mute">[+] </tspan>40.9k tok/s on one card</text>
      <text x="740" y="212" class="ink"><tspan class="mute">[+] </tspan>BPB 1.936 held-out</text>
      <text x="740" y="248" class="ink"><tspan class="mute">[+] </tspan>882 tests, ruff clean</text>
      <text x="740" y="284" class="ink"><tspan class="mute">[+] </tspan>MIT license</text>
    </g>

    <!-- the block-pixel mouse, four rows of nine cells, exactly as the site draws it -->
    <g font-size="11" class="ink" aria-hidden="true">
      <text x="1112" y="128">&#9604;&#9604; &#9604;&#9604;</text>
      <text x="1112" y="142">&#9608;&#9600;&#9600;&#9600;&#9600;&#9600;&#9600;&#9600;&#9608;</text>
      <text x="1112" y="156">&#9608; &#9679; &#9679; &#9608;</text>
      <text x="1112" y="170">&#9600;&#9600;&#9600;&#9600;&#9600;&#9600;&#9600;</text>
    </g>
  </g>
</svg>
