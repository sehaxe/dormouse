<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="dormouse — a byte-level Mixture-of-Experts language model trained on one consumer GPU">
  <!-- The banner follows the same design language as the site: warm cream
       canvas, near-black ink, 1px hairlines, one dark surface (the terminal
       card), everything monospaced. Tokens from the opencode DESIGN.md. -->
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .ink { fill: #201d1d; }
      .body { fill: #424245; }
      .mute { fill: #646262; }
      .on-dark { fill: #fdfcfc; }
      .on-dark-mute { fill: #9a9898; }
      .hair { stroke: rgba(15, 0, 0, 0.12); stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="340" fill="#fdfcfc" />
  <rect x="0.5" y="0.5" width="1199" height="339" class="hair" />

  <g class="mono">
    <!-- top rail -->
    <text x="48" y="52" font-size="13" class="mute">[+] byte-level moe &#183; no tokenizer &#183; one consumer gpu</text>
    <text x="1152" y="52" font-size="13" class="mute" text-anchor="end">$429</text>

    <!-- wordmark -->
    <text x="46" y="132" font-size="68" font-weight="700" class="ink">dormouse</text>

    <!-- tagline -->
    <text x="48" y="176" font-size="16" class="body">A byte-level Mixture-of-Experts language model on one consumer GPU.</text>

    <!-- the one dark surface: a terminal card -->
    <rect x="48" y="200" width="640" height="124" rx="4" fill="#201d1d" />
    <g fill="#fdfcfc" transform="translate(66 216)">
      <rect x="0" y="0" width="12" height="4"/>
      <rect x="0" y="4" width="4" height="4"/>
      <rect x="12" y="4" width="4" height="4"/>
      <rect x="0" y="8" width="4" height="4"/>
      <rect x="12" y="8" width="4" height="4"/>
      <rect x="0" y="12" width="4" height="4"/>
      <rect x="12" y="12" width="4" height="4"/>
      <rect x="0" y="16" width="12" height="4"/>
      <rect x="24" y="0" width="8" height="4"/>
      <rect x="20" y="4" width="4" height="4"/>
      <rect x="32" y="4" width="4" height="4"/>
      <rect x="20" y="8" width="4" height="4"/>
      <rect x="32" y="8" width="4" height="4"/>
      <rect x="20" y="12" width="4" height="4"/>
      <rect x="32" y="12" width="4" height="4"/>
      <rect x="24" y="16" width="8" height="4"/>
      <rect x="40" y="0" width="4" height="4"/>
      <rect x="48" y="0" width="8" height="4"/>
      <rect x="40" y="4" width="8" height="4"/>
      <rect x="40" y="8" width="4" height="4"/>
      <rect x="40" y="12" width="4" height="4"/>
      <rect x="40" y="16" width="4" height="4"/>
      <rect x="60" y="0" width="8" height="4"/>
      <rect x="72" y="0" width="8" height="4"/>
      <rect x="60" y="4" width="4" height="4"/>
      <rect x="68" y="4" width="4" height="4"/>
      <rect x="76" y="4" width="4" height="4"/>
      <rect x="60" y="8" width="4" height="4"/>
      <rect x="68" y="8" width="4" height="4"/>
      <rect x="76" y="8" width="4" height="4"/>
      <rect x="60" y="12" width="4" height="4"/>
      <rect x="68" y="12" width="4" height="4"/>
      <rect x="76" y="12" width="4" height="4"/>
      <rect x="60" y="16" width="4" height="4"/>
      <rect x="68" y="16" width="4" height="4"/>
      <rect x="76" y="16" width="4" height="4"/>
      <rect x="88" y="0" width="8" height="4"/>
      <rect x="84" y="4" width="4" height="4"/>
      <rect x="96" y="4" width="4" height="4"/>
      <rect x="84" y="8" width="4" height="4"/>
      <rect x="96" y="8" width="4" height="4"/>
      <rect x="84" y="12" width="4" height="4"/>
      <rect x="96" y="12" width="4" height="4"/>
      <rect x="88" y="16" width="8" height="4"/>
      <rect x="104" y="0" width="4" height="4"/>
      <rect x="116" y="0" width="4" height="4"/>
      <rect x="104" y="4" width="4" height="4"/>
      <rect x="116" y="4" width="4" height="4"/>
      <rect x="104" y="8" width="4" height="4"/>
      <rect x="116" y="8" width="4" height="4"/>
      <rect x="104" y="12" width="4" height="4"/>
      <rect x="116" y="12" width="4" height="4"/>
      <rect x="108" y="16" width="12" height="4"/>
      <rect x="128" y="0" width="12" height="4"/>
      <rect x="124" y="4" width="4" height="4"/>
      <rect x="128" y="8" width="8" height="4"/>
      <rect x="136" y="12" width="4" height="4"/>
      <rect x="124" y="16" width="12" height="4"/>
      <rect x="148" y="0" width="8" height="4"/>
      <rect x="144" y="4" width="4" height="4"/>
      <rect x="156" y="4" width="4" height="4"/>
      <rect x="144" y="8" width="16" height="4"/>
      <rect x="144" y="12" width="4" height="4"/>
      <rect x="148" y="16" width="12" height="4"/>
    </g>
    <text x="66" y="266" font-size="13" class="on-dark-mute">$ dormouse train medium --set seq_len=1024</text>
    <text x="66" y="288" font-size="13" class="on-dark">step=60000  loss=1.2130  bpb=1.936  40.9k tok/s</text>
    <text x="66" y="310" font-size="13" class="on-dark-mute">ready &#8212; one RTX 5060 Ti 16GB, $429</text>

    <!-- stat column -->
    <g font-size="15">
      <text x="740" y="140" class="ink"><tspan class="mute">[+] </tspan>1.07B total &#183; 57M active</text>
      <text x="740" y="176" class="ink"><tspan class="mute">[+] </tspan>40.9k tok/s on one card</text>
      <text x="740" y="212" class="ink"><tspan class="mute">[+] </tspan>BPB 1.936 held-out</text>
      <text x="740" y="248" class="ink"><tspan class="mute">[+] </tspan>968 tests, ruff clean</text>
      <text x="740" y="284" class="ink"><tspan class="mute">[+] </tspan>MIT license</text>
    </g>

    <!-- The brand mark: the mini 'd' on the wordmark's own 5-row cell grid
         (tools/mk_wordmark.py), the same glyph the favicon and the nav carry.
         Rects, not <text>: a block character's advance is the reader's font's,
         a rect's is not. -->
    <g fill="#201d1d" transform="translate(1128 104)">
      <rect x="0" y="0" width="18" height="6"/>
      <rect x="0" y="6" width="6" height="6"/>
      <rect x="18" y="6" width="6" height="6"/>
      <rect x="0" y="12" width="6" height="6"/>
      <rect x="18" y="12" width="6" height="6"/>
      <rect x="0" y="18" width="6" height="6"/>
      <rect x="18" y="18" width="6" height="6"/>
      <rect x="0" y="24" width="18" height="6"/>
    </g>
  </g>
</svg>
