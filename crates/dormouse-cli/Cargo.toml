[package]
name = "dormouse-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
cuda = ["dormouse-core/cuda", "dormouse-train/cuda", "burn/cuda"]

[dependencies]
dormouse-core = { path = "../dormouse-core" }
dormouse-data = { path = "../dormouse-data" }
dormouse-train = { path = "../dormouse-train" }
dormouse-bench = { path = "../dormouse-bench" }
clap = { version = "4", features = ["derive"] }
half = { version = "2.5", features = ["num-traits"] }
rand = "0.8"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
burn-train = { version = "0.22.0-pre.3" }
burn = { version = "0.22.0-pre.3", default-features = false, features = ["std"] }
