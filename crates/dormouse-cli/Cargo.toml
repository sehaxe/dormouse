[package]
name = "dormouse-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["cpu"]
cpu = ["dormouse-train/cpu"]
cuda = ["dormouse-core/cuda", "dormouse-train/cuda"]

[dependencies]
dormouse-core = { path = "../dormouse-core" }
dormouse-data = { path = "../dormouse-data" }
dormouse-train = { path = "../dormouse-train", default-features = false }
dormouse-bench = { path = "../dormouse-bench", default-features = false }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
half = { version = "2.5", features = ["num-traits"] }
rand = "0.8"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
burn-train = { version = "0.22.0-pre.3" }
burn = { version = "0.22.0-pre.3", default-features = false, features = ["std"] }
