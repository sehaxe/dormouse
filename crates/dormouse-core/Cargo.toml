[package]
name = "dormouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
burn = { workspace = true, features = ["std", "extension"] }
burn-tensor = { workspace = true }
burn-cuda = { workspace = true, features = ["std", "autotune"] }
burn-kda = { path = "../../vendor/dormouse-fused/crates/burn-kda" }
# The fused-kernel seam counters (ADR-0019): burn-kda's fused dispatch hands
# its launch counts to burn-gdn2, which is the crate that owns them.
burn-gdn2 = { path = "../../vendor/dormouse-fused/crates/burn-gdn2", default-features = false }
burn-bitnet = { path = "../../vendor/dormouse-fused/crates/burn-bitnet" }
burn-engram = { path = "../../vendor/dormouse-fused/crates/burn-engram" }
burn-rmsnorm = { path = "../../vendor/dormouse-fused/crates/burn-rmsnorm" }
burn-jepa = { path = "../../vendor/dormouse-fused/crates/burn-jepa" }
burn-dspark = { path = "../../vendor/dormouse-fused/crates/burn-dspark", features = ["training"] }
burn-spectral = { path = "../../vendor/dormouse-fused/crates/burn-spectral" }
# MoR routing mechanism (arXiv 2507.10524): the shared router + the repaired
# top-k index primitive the loop's per-position routing rides on.
burn-mhc = { path = "../../vendor/dormouse-fused/crates/burn-mhc" }
burn-mor = { path = "../../vendor/dormouse-fused/crates/burn-mor" }
# Attention Residuals (arXiv:2603.15031): the residual-stream arm, Full mode
# over the loop's iteration states. Off by default (`use_attnres`); the crate
# is in the build because the model reads it, not as a reference port.
burn-attnres = { path = "../../vendor/dormouse-fused/crates/burn-attnres" }
# SiTU-GLU (arXiv:2607.24653v2 Eq 12, Kimi K3): the expert FFN's activation
# arm, off by default (`use_situ`). DEFAULT FEATURES ONLY, deliberately - the
# tensor path IS the reference form, and burn-situ's fused kernel has never
# executed in any job in this repo (vendor/dormouse-fused/tools/gpu-gate.sh:73-77),
# which is the burn-rmsnorm situation exactly. Enabling `burn-situ/cuda` needs a
# CUDA gate that compares the fused output to the tensor path first; see
# docs/reviews/situ-2026-09-30.md §7.
burn-situ = { path = "../../vendor/dormouse-fused/crates/burn-situ" }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

# cargo-machete cannot see through the `burn` facade: this crate's sources say
# `use burn::tensor::Tensor`, and the string `burn_tensor` appears ZERO times in
# them, so a literal grep reads the direct `burn-tensor` declaration as unused.
# It is not, and deleting it is a LOUD failure rather than a silent one - the
# `std` feature below names `burn-tensor/std`, so cargo refuses the manifest:
#     error: feature `std` includes `burn-tensor/std`, but `burn-tensor`
#            is not a dependency
# (`burn::std` does not forward it; the feature list has to name it.)
# `burn-nn` was in this list until 2026-10-01 and is now DELETED instead: with
# the declaration removed, `cargo tree -e features` for this crate was
# byte-identical (884 package+feature edges either way), so it was a no-op and
# an `ignored` entry would have been a lie about a dependency that does nothing.
[package.metadata.cargo-machete]
ignored = ["burn-tensor"]

[features]
default = ["std"]
# The CPU backend is burn-flex (upstream's burn-ndarray replacement, and the
# one that has f16/bf16). No BLAS: burn-flex matmuls through the `gemm` crate,
# so the test path needs no native build dependency at all.
std = ["burn/std", "burn-tensor/std", "burn/autodiff", "burn/flex"]
cuda = [
    "burn/cuda",
    "burn-kda/cuda",
    "burn-kda/autodiff",
    "burn-gdn2/cuda",
    "burn-gdn2/autodiff",
    "burn-spectral/cuda",
    "burn-rmsnorm/cuda",
    "burn-attnres/cuda",
]
# CUDA-only probes: burn-cuda types and a CUDA context exist only with the
# cuda feature.
[[example]]
name = "quant_probe"
required-features = ["cuda"]
