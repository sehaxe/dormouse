[package]
name = "dormouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
burn = { version = "0.22.0-pre.4", default-features = false, features = ["std", "extension"] }
burn-tensor = { version = "0.22.0-pre.4", default-features = false }
burn-nn = { version = "0.22.0-pre.4", default-features = false }
burn-cuda = { version = "0.22.0-pre.4", default-features = false, features = ["std", "autotune"] }
burn-kda = { path = "../../vendor/burn-fused/crates/burn-kda" }
# The fused-kernel seam counters (ADR-0019): burn-kda's fused dispatch hands
# its launch counts to burn-gdn2, which is the crate that owns them.
burn-gdn2 = { path = "../../vendor/burn-fused/crates/burn-gdn2", default-features = false }
burn-bitnet = { path = "../../vendor/burn-fused/crates/burn-bitnet" }
burn-engram = { path = "../../vendor/burn-fused/crates/burn-engram" }
burn-rmsnorm = { path = "../../vendor/burn-fused/crates/burn-rmsnorm" }
burn-jepa = { path = "../../vendor/burn-fused/crates/burn-jepa" }
burn-dspark = { path = "../../vendor/burn-fused/crates/burn-dspark", features = ["training"] }
burn-spectral = { path = "../../vendor/burn-fused/crates/burn-spectral" }
# MoR routing mechanism (arXiv 2507.10524): the shared router + the repaired
# top-k index primitive the loop's per-position routing rides on.
burn-mor = { path = "../../vendor/burn-fused/crates/burn-mor" }
# Attention Residuals (arXiv:2603.15031): the residual-stream arm, Full mode
# over the loop's iteration states. Off by default (`use_attnres`); the crate
# is in the build because the model reads it, not as a reference port.
burn-attnres = { path = "../../vendor/burn-fused/crates/burn-attnres" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[features]
default = ["std"]
# The CPU backend is burn-flex (upstream's burn-ndarray replacement, and the
# one that has f16/bf16). No BLAS: burn-flex matmuls through the `gemm` crate,
# so the test path needs no native build dependency at all.
std = ["burn/std", "burn-tensor/std", "burn/autodiff", "burn/flex"]
cuda = [
    "burn/cuda",
    "burn-kda/cuda",
    "burn-kda/autodiff",
    "burn-gdn2/cuda",
    "burn-gdn2/autodiff",
    "burn-spectral/cuda",
    "burn-rmsnorm/cuda",
    "burn-attnres/cuda",
]
# CUDA-only probes: burn-cuda types and a CUDA context exist only with the
# cuda feature.
[[example]]
name = "quant_probe"
required-features = ["cuda"]
