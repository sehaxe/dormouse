[package]
name = "dormouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
burn = { workspace = true, features = ["std", "extension"] }
burn-tensor = { workspace = true }
burn-nn = { version = "0.22.0-pre.4", default-features = false }
burn-cuda = { workspace = true, features = ["std", "autotune"] }
dormouse-kda = { path = "../../vendor/dormouse-fused/crates/dormouse-kda" }
# The fused-kernel seam counters (ADR-0019): dormouse-kda's fused dispatch hands
# its launch counts to dormouse-gdn2, which is the crate that owns them.
dormouse-gdn2 = { path = "../../vendor/dormouse-fused/crates/dormouse-gdn2", default-features = false }
dormouse-bitnet = { path = "../../vendor/dormouse-fused/crates/dormouse-bitnet" }
dormouse-engram = { path = "../../vendor/dormouse-fused/crates/dormouse-engram" }
dormouse-rmsnorm = { path = "../../vendor/dormouse-fused/crates/dormouse-rmsnorm" }
dormouse-jepa = { path = "../../vendor/dormouse-fused/crates/dormouse-jepa" }
dormouse-dspark = { path = "../../vendor/dormouse-fused/crates/dormouse-dspark", features = ["training"] }
dormouse-spectral = { path = "../../vendor/dormouse-fused/crates/dormouse-spectral" }
# MoR routing mechanism (arXiv 2507.10524): the shared router + the repaired
# top-k index primitive the loop's per-position routing rides on.
dormouse-mhc = { path = "../../vendor/dormouse-fused/crates/dormouse-mhc" }
dormouse-mor = { path = "../../vendor/dormouse-fused/crates/dormouse-mor" }
# Attention Residuals (arXiv:2603.15031): the residual-stream arm, Full mode
# over the loop's iteration states. Off by default (`use_attnres`); the crate
# is in the build because the model reads it, not as a reference port.
dormouse-attnres = { path = "../../vendor/dormouse-fused/crates/dormouse-attnres" }
# SiTU-GLU (arXiv:2607.24653v2 Eq 12, Kimi K3): the expert FFN's activation
# arm, off by default (`use_situ`). DEFAULT FEATURES ONLY, deliberately - the
# tensor path IS the reference form, and dormouse-situ's fused kernel has never
# executed in any job in this repo (vendor/dormouse-fused/tools/gpu-gate.sh:73-77),
# which is the dormouse-rmsnorm situation exactly. Enabling `dormouse-situ/cuda` needs a
# CUDA gate that compares the fused output to the tensor path first; see
# docs/reviews/situ-2026-09-30.md §7.
dormouse-situ = { path = "../../vendor/dormouse-fused/crates/dormouse-situ" }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }

[features]
default = ["std"]
# The CPU backend is burn-flex (upstream's burn-ndarray replacement, and the
# one that has f16/bf16). No BLAS: burn-flex matmuls through the `gemm` crate,
# so the test path needs no native build dependency at all.
std = ["burn/std", "burn-tensor/std", "burn/autodiff", "burn/flex"]
cuda = [
    "burn/cuda",
    "dormouse-kda/cuda",
    "dormouse-kda/autodiff",
    "dormouse-gdn2/cuda",
    "dormouse-gdn2/autodiff",
    "dormouse-spectral/cuda",
    "dormouse-rmsnorm/cuda",
    "dormouse-attnres/cuda",
]
# CUDA-only probes: burn-cuda types and a CUDA context exist only with the
# cuda feature.
[[example]]
name = "quant_probe"
required-features = ["cuda"]
