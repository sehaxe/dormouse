[package]
name = "dormouse-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
burn = { version = "0.22.0-pre.4", default-features = false, features = ["std", "extension"] }
burn-tensor = { version = "0.22.0-pre.4", default-features = false }
burn-nn = { version = "0.22.0-pre.4", default-features = false }
burn-cuda = { version = "0.22.0-pre.4", default-features = false, features = ["std", "fusion"] }
burn-kda = { path = "../../vendor/burn-fused/crates/burn-kda" }
burn-msa = { path = "../../vendor/burn-fused/crates/burn-msa" }
burn-bitnet = { path = "../../vendor/burn-fused/crates/burn-bitnet" }
burn-engram = { path = "../../vendor/burn-fused/crates/burn-engram" }
burn-rmsnorm = { path = "../../vendor/burn-fused/crates/burn-rmsnorm" }
burn-jepa = { path = "../../vendor/burn-fused/crates/burn-jepa" }
burn-dspark = { path = "../../vendor/burn-fused/crates/burn-dspark", features = ["training"] }
burn-spectral = { path = "../../vendor/burn-fused/crates/burn-spectral" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Already in the build graph via burn-cuda / burn-spectral(cuda); declared so
# fused.rs can name CubeTensor and launch #[cube] kernels directly.
burn-cubecl = { version = "0.22.0-pre.4", default-features = false, features = ["std"], optional = true }
cubecl = { version = "0.11.0-pre.4", default-features = false, features = ["std", "cuda"], optional = true }
# already compiled via burn-spectral(cuda); needed to block on client.sync()
futures-lite = { version = "2", optional = true }

[dev-dependencies]
burn-ndarray = { version = "0.22.0-pre.4", features = ["blas-openblas"] }

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std", "burn/autodiff", "burn/ndarray"]
cuda = [
    "burn/cuda",
    "burn-kda/cuda",
    "burn-kda/autodiff",
    "burn-msa/cuda",
    "burn-msa/autodiff",
    "burn-spectral/cuda",
    "burn-rmsnorm/cuda",
    "dep:burn-cubecl",
    "dep:cubecl",
    "dep:futures-lite",
]
# CUDA-only probe: burn-cuda types exist only with the cuda feature.
[[example]]
name = "quant_probe"
required-features = ["cuda"]
