[package]
name = "dormouse-train"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["cpu"]
cpu = ["dep:burn-ndarray"]
cuda = ["burn/cuda", "burn/autodiff", "dormouse-core/cuda", "burn-muon-plus/cuda"]

[dependencies]
dormouse-core = { path = "../dormouse-core" }
dormouse-data = { path = "../dormouse-data" }
dormouse-bench = { path = "../dormouse-bench" }
burn-spectral = { path = "../../../burn-fused/crates/burn-spectral" }
burn-bitnet = { path = "../../../burn-fused/crates/burn-bitnet" }
burn-muon-plus = { path = "../../../burn-fused/crates/burn-muon-plus" }
burn = { version = "0.22.0-pre.3", default-features = false, features = ["std", "autodiff", "optim"] }
burn-tensor = { version = "0.22.0-pre.3", default-features = false }
burn-ndarray = { optional = true, version = "0.22.0-pre.3", features = ["blas-openblas"] }
burn-cuda = { version = "0.22.0-pre.3", default-features = false, features = ["std"] }
burn-dispatch = { version = "0.22.0-pre.3", default-features = false }
cubecl-runtime = { version = "0.11.0-pre.3", default-features = false }
cubecl-cuda = { version = "0.11.0-pre.3", default-features = false }
cudarc = { version = "0.19.9", default-features = false, features = ["driver"] }
half = { version = "2.5", features = ["num-traits"] }
rand = "0.8"