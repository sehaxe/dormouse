[package]
name = "dormouse-train"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["cpu"]
# The CPU backend is burn-flex: pure Rust, no BLAS, and unlike the deprecated
# burn-ndarray it supports f16/bf16.
cpu = ["burn/flex"]
cuda = ["burn/cuda", "burn/autodiff", "dormouse-core/cuda", "burn-muon-plus/cuda"]

[dev-dependencies]
# The divergence measurement is a program, not a test (a trained model is a
# moving target), so it needs the CLI parser outside the lib. It runs on the CPU
# backend on purpose: the narrowing is host arithmetic, and a measurement that
# needs the GPU is a measurement that cannot run beside a training run.
clap = { workspace = true, features = ["derive"] }

[dependencies]
dormouse-core = { path = "../dormouse-core" }
dormouse-data = { path = "../dormouse-data" }
burn-spectral = { path = "../../vendor/dormouse-fused/crates/burn-spectral" }
burn-bitnet = { path = "../../vendor/dormouse-fused/crates/burn-bitnet" }
burn-muon-plus = { path = "../../vendor/dormouse-fused/crates/burn-muon-plus" }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
# The export's two primitives, both already in this build graph through burn
# (burn-std re-exports `half`) and burn-pack (`crc32fast`), so neither is a new
# dependency in the compile.
half = "2"
crc32fast = "1"
burn = { workspace = true, features = ["std", "autodiff", "optim"] }
burn-cuda = { workspace = true, features = ["std", "autotune"] }
burn-dispatch = { version = "0.22.0-pre.4", default-features = false }
cubecl-runtime = { version = "0.11.0-pre.4", default-features = false }
cubecl-cuda = { version = "0.11.0-pre.4", default-features = false }
# kda_alloc_probe needs a real device barrier (`Client::sync` returns a
# future) and this is the only blocking executor on the stack.
cubecl-environment = { version = "0.11.0-pre.4", default-features = false }
cudarc = { workspace = true, features = ["driver"] }
# Uses `Device::cuda(0)`, which only exists with the `cuda` feature. Without
# this a plain `cargo check --all-targets` fails on it, and cargo stops
# reporting targets after the first failure - so one ungated example hides
# whether every other target compiles. Same shape as
# `dormouse-core/examples/quant_probe.rs`, which AGENTS.md 2.5 already
# documents and which nobody applied here.
[[example]]
name = "kda_alloc_probe"
required-features = ["cuda"]

# The graph seam's gates need a real card: a graph capture, a replay, and a
# differential against fresh launches. Declared explicitly because a file-level
# `#![cfg(feature = "cuda")]` alone builds an EMPTY test binary and prints a
# green "0 tests" — the false green that hid `kda_param_grads_cuda`'s absence
# for a day (memory.md, 2026-09-29).
[[test]]
name = "graph_seam_cuda"
required-features = ["cuda"]

# The stage seam's gate (capture -> replay -> bit-identical latents) needs the
# card, for the same reason and with the same false-green guard as
# `graph_seam_cuda` above.
[[test]]
name = "stage_capture_cuda"
required-features = ["cuda"]
