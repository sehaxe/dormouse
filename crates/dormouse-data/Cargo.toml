[package]
name = "dormouse-data"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
arrow = "59.2.0"
parquet = { version = "59.2.0", features = ["arrow"] }
# sft: the JSONL conversation format. Neither is a new crate in this build
# graph — serde_json is already compiled for arrow-json and burn-core (see
# Cargo.lock), so the SFT reader adds a dependency, not a compile.
serde = { workspace = true }
serde_json = "1"
