# dormouse preset: swift50 (flat schema, ADR-0005; missing keys = schema defaults)
bf16 = false
act_group = 0
d_model = 1024
n_heads = 16
head_dim = 64
d_ffn = 4096
vocab = 256
max_seq_len = 512
max_iter = 8
rank = 96
norm_eps = 0.001
use_kda = true
use_engram = true
use_gr = false
n_experts = 8
jepa_weight = 0.0
jepa_mask_frac = 0.15
jepa_mask_span = 8
dspark_weight = 0.0
dspark_k = 4
dspark_stride = 16

# Hashed n-gram memory (Engram), the 2026-09-27 re-enable. 25_000 rows/order x
# 3 orders x 32 dim; each table rounds UP to a power of two, so what is built is
# 3 x 32 768 x 32 = 3 145 728 memory params. See configs/small.toml for why the
# budget is the DeepSeek allocation ratio (20-25% of the model) and not the
# 500K/order that the iso-parameter curve peaks at on a 16x larger backbone.
# This preset's share is NOT measured: this width is behind
# `cargo test -p dormouse-core --test preset_exec -- --ignored`, which prints
# it. The rows are the same 3 145 728 every preset pays; the shares measured
# 2026-10-01 are nano 43.7%, small 34.2%, base 24.1% (docs/guides/presets.md).
engram_rows = 25000
engram_orders = [2, 3, 4]
engram_dim = 32
engram_lam_max = 0.5
