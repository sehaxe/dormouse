# port mix plan: v3 — mix_v2 plus INSTRUCTION-FORMATTED pretraining data.
#
# The lever: SmolLM2's two-stage recipe puts ~10-20% instruction-formatted text
# into the PRETRAIN mixture, not only into SFT. At our scale this is the single
# cheapest way to buy conversational behaviour: it costs zero extra tokens (it
# replaces web share) and it teaches the Q/A marker template in the same pass
# that teaches the language.
#
# The source is `data_local/mix2/instruct.bin` — 417 857 pairs (112.9 MB)
# rendered with `dormouse.train.sft.render` (the SAME 0x01/0x02/0x03 template
# SFT uses), built from the local dialog corpora: aria_ru (rudialog),
# aria_en (agentic), aria_reason (CoT), distill_clean2 and more_short.
# Deduped, length-filtered (q<=300 B, a<=400 B, record<=480 B), sentinels
# rejected.
#
# Weights are small on purpose: 113 MB against a 230 GB corpus is 0.05%, so a
# stage weight of 0.02-0.07 means the source is re-read ~1-3 times over a
# multi-GB run. The epoch cap (max_epochs=4) names it if a run grows past that.
# Stage 3 is the decay phase, where instruction share rises (decay is where the
# final quality is set).
#
# Everything else (shard directories, seeded shuffle, epoch arithmetic, why
# `reasoning` stays out) is `mix_big.toml`'s and applies here.

max_epochs = 4.0
seed = 1

[[stage]]
until_frac = 0.70
[stage.weights]
web = 0.88
wiki = 0.10
instruct = 0.02

[[stage]]
until_frac = 0.90
[stage.weights]
web = 0.52
wiki = 0.10
ruweb = 0.12
math = 0.16
code = 0.06
instruct = 0.04

[[stage]]
until_frac = 1.00
[stage.weights]
web = 0.25
wiki = 0.05
ruweb = 0.20
math = 0.33
code = 0.10
instruct = 0.07

[sources]
web = "/mnt/e43497ab-0ff2-45b4-b45f-28de3339a53e/aria_data/pretrain/mix/web"
wiki = "/mnt/e43497ab-0ff2-45b4-b45f-28de3339a53e/aria_data/pretrain/mix/wiki"
ruweb = "/mnt/e43497ab-0ff2-45b4-b45f-28de3339a53e/aria_data/pretrain/mix/ruweb"
math = "/mnt/e43497ab-0ff2-45b4-b45f-28de3339a53e/aria_data/pretrain/mix/math"
code = "/home/sehaxe/dormouse/data_local/mix/code.bin"
instruct = "/home/sehaxe/dormouse/data_local/mix2/instruct.bin"
