# dormouse preset: p150 - the 150M-program flagship (see docs/architecture/PLAN.md).
# Overrides only; missing keys = schema defaults (== small). Flat per ADR-0005.
d_model = 4096
n_heads = 64
head_dim = 64
d_ffn = 11264
n_experts = 4
max_iter = 12
max_seq_len = 2048
# core params measured with the header probe: 159,720,195
# Engram rows live in host RAM as a train-side knob (--engram-slots), not here.

# Hashed n-gram memory (Engram), the 2026-09-27 re-enable. 25_000 rows/order x
# 3 orders x 32 dim = 2.4M memory params; see configs/small.toml for why the
# budget is the DeepSeek allocation ratio (20-25% of the model) and not the
# 500K/order that the iso-parameter curve peaks at on a 16x larger backbone.
# At this preset's width the same 2.4M is 1.5% of the model.
engram_rows = 25000
engram_orders = [2, 3, 4]
engram_dim = 32
engram_lam_max = 0.5
