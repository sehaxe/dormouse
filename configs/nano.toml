# dormouse preset: nano (flat schema, ADR-0005; missing keys = schema defaults)
bf16 = false
act_group = 0
d_model = 512
n_heads = 8
head_dim = 64
d_ffn = 2048
vocab = 256
use_byteflow = false
max_seq_len = 512
max_iter = 4
rank = 96
norm_eps = 0.001
use_kda = true
use_engram = true
use_gr = false
n_experts = 3
jepa_weight = 0.05
jepa_mask_frac = 0.15
jepa_mask_span = 8
dspark_weight = 0.0
dspark_k = 4
dspark_stride = 16

# Hashed n-gram memory (Engram), the 2026-09-27 re-enable. 25_000 rows/order x
# 3 orders x 32 dim; each table rounds UP to a power of two, so what is built is
# 3 x 32 768 x 32 = 3 145 728 memory params. See configs/small.toml for why the
# budget is the DeepSeek allocation ratio (20-25% of the model) and not the
# 500K/order that the iso-parameter curve peaks at on a 16x larger backbone.
# Measured 2026-10-01 on the instantiated model (`preset_exec`): 3 145 728 of
# 7 193 002 = 43.7%. That is ABOVE the 20-25% band the sentence above names -
# the budget was set on a retracted 7.5M-backbone arithmetic, so on the narrowest
# preset it does not land on the ratio it was chosen for. Table: docs/guides/presets.md.
engram_rows = 25000
engram_orders = [2, 3, 4]
engram_dim = 32
engram_lam_max = 0.5
