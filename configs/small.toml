# dormouse preset: small (flat schema, ADR-0005; these are also the schema defaults)
bf16 = false
act_group = 0
d_model = 768
n_heads = 12
head_dim = 64
d_ffn = 2048
vocab = 256
max_seq_len = 512
max_iter = 4
rank = 64
norm_eps = 0.001
use_kda = true
use_engram = true
use_gr = false
n_experts = 3
jepa_weight = 0.05
jepa_mask_frac = 0.15
jepa_mask_span = 8
dspark_weight = 0.0
dspark_k = 4
dspark_stride = 16
# Future-byte auxiliary head (our adaptation of arXiv 2404.19737's per-horizon
# multi-token heads to a byte-level AR model). OFF: the weight is 0, so the
# head is not even BUILT (AuxHeads.fb is None) and this recipe's parameters and
# checkpoint are byte-identical to a build from before the arm existed. Turn it
# on with `--set aux_fb_weight=0.1`; horizon is in BYTE POSITIONS and 0 is
# refused (targets[q + 0] is the byte the main CE already predicts).
aux_fb_weight = 0.0
aux_fb_horizon = 2
# Hashed n-gram memory (Engram). Capacity budget, not tuning knobs: the arm
# was off because its row budget broke the 50% memory-share gate (the
# `share <= 0.5` assert in `preset_exec::cost_of_preset`) and monopolized the loss.
# 25_000 rows/order x 3 orders x 32 dim; each table rounds UP to a power of two,
# so what is built is 3 x 32 768 x 32 = 3 145 728 memory params. Measured
# 2026-10-01 on the instantiated model: 3 145 728 of 9 197 454 = 34.2%. The
# budget was picked as DeepSeek's own shipped operating point (V4.1-Flash 196B
# Engram vs a 552B backbone = 26% of total; its stated law is 20-25% of the
# sparse budget) - so the measured 34.2% sits ABOVE that band, because the ratio
# was set against a retracted 7.5M-backbone count rather than a measurement.
# The measured slot-count curve (arXiv 2601.16531, iso-parameter at a 125M
# backbone) peaks at 500K/order, but that backbone is 16x ours: the same 500K
# here is 48M params = 5.2x the measured total, i.e. the monopoly shape again.
# The curve is flat 300K-500K and silent below, so the ratio anchors the default
# and the 500K point stays a ladder rung.
# Orders 2/3/4 replace the dead 3/5/8 (only n=3 had per-key support; n=5/n=8
# were ~5775-way averages). engram_lam_max is the HARD floor on the memory's
# share of its branch (`lam = min(w_mem, 0.5)`, the other half a dense
# projection of the same hidden state) - kNN-LM eq. 3 / FwPKM eq. 12, a
# constant, not a learned value.
engram_rows = 25000
engram_orders = [2, 3, 4]
engram_dim = 32
engram_lam_max = 0.5
use_mor = false
mor_k = 2
mor_bce_weight = 0.05
