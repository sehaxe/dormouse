# port mix plan: big — the mounted corpora as SHARD DIRECTORIES (train/mixture.py).
#
# A source is a DIRECTORY here, not a `.bin`: `open_source` sees a directory and
# opens `ShardStream`, which reads the `*.txt` shards in a SEEDED SHUFFLED order
# (`shard_order`), one open file at a time. No concatenated `.bin` is built —
# 227 GB is already on the drive and would only be copied, while the drive
# sustains 146 MB/s against a ~40 KB/s training read. The shuffle is the point:
# `build_corpus.py` wrote the shards in download order, so consecutive files are
# one crawl/period and reading them in order is the category-boundary spike the
# burn side hit (1.46 -> 8.69 at ~step 25k of a joint run,
# aria_data/plan_txt_streamer.md).
#
# Paths are absolute because the corpora live on an external drive, not in the
# repo; `[sources]` paths that are relative resolve beside this file. The UUID
# below is THAT drive's: on another machine, point the four paths at wherever the
# shard directories are (`dormouse train … --set mix_plan=configs/mix_big.toml`
# plus an edit here, or your own plan — see docs/guides/data.md).
#
# --- what is in, what is out -------------------------------------------------
#
# `code` (90 GB) is deliberately EXCLUDED. It is mislabeled junk — sampled and
# verified: spam, novels and forum dumps, not source code. Training on it would
# teach the model that "code" is prose.
#
# `math` (86 GB) IS included, and it is not clean either: it is LaTeX-heavy and
# carries forum noise (its shards open with things like a tides worksheet).
# Hence its weight grows only in the decay stage, where a domain shift is what
# the stage is for — and it is never a majority.
#
# `reasoning` (2.4 GB) is EXCLUDED on arithmetic, not on quality: 2.4 GB x 4 = 9.6 GB
# is all the 4-epoch cap allows, i.e. a 4.2% share of ONE mixture pass — and less
# at any longer run. A 2.4 GB source cannot carry a stage weight; include it only
# with `--set max_epochs=0` (off), and knowing it is then read many times over.
#
# --- the epoch arithmetic (checked against a named budget) -------------------
#
# Weights are SHARES of the step budget; the epoch cap needs a size to compare
# them against, so here is the table at ONE FULL PASS over the mixture
# (229.8 GB = 44 793 059 steps at batch 10 x seq 512, 5 130 B/step):
#
#   source       size     S1 70%  S2 20%  S3 10%   share    read/pass   EPOCHS/pass
#   web        109.6 GB    0.90    0.60    0.35    0.785    180.4 GB      1.65
#   wiki        14.5 GB    0.10    0.10    0.05    0.095     21.8 GB      1.51
#   ruweb       19.3 GB      —     0.12    0.20    0.044     10.1 GB      0.52
#   math        86.4 GB      —     0.18    0.40    0.076     17.5 GB      0.20
#
# Every source is under 2x at a full pass. `max_epochs = 4.0` (2305.16264: MoE
# degrades past ~4x repetition) therefore starts biting at ~108M steps, where
# `web` trips it LOUDLY and the message names the source and the escape
# (`--set max_epochs=N`, `0` = off). For scale: a 100 000-step run reads 0.51 GB
# in total — 0.0037x of `web`.
#
# `seed` governs the source draw AND every source's shard order; the run's
# `--seed` overrides it (a run is `(seed, step)`-deterministic, AGENTS ADR-0021).

max_epochs = 4.0
seed = 1

[[stage]]
until_frac = 0.70
[stage.weights]
web = 0.90
wiki = 0.10

[[stage]]
until_frac = 0.90
[stage.weights]
web = 0.60
wiki = 0.10
ruweb = 0.12
math = 0.18

[[stage]]
until_frac = 1.00
[stage.weights]
web = 0.35
wiki = 0.05
ruweb = 0.20
math = 0.40

[sources]
web = "/mnt/e43497ab-0ff2-45b4-b45f-28de3339a53e/aria_data/pretrain/mix/web"
wiki = "/mnt/e43497ab-0ff2-45b4-b45f-28de3339a53e/aria_data/pretrain/mix/wiki"
ruweb = "/mnt/e43497ab-0ff2-45b4-b45f-28de3339a53e/aria_data/pretrain/mix/ruweb"
math = "/mnt/e43497ab-0ff2-45b4-b45f-28de3339a53e/aria_data/pretrain/mix/math"
