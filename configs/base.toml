# dormouse preset: base (flat schema, ADR-0005; missing keys = schema defaults)
bf16 = false
act_group = 0
d_model = 1024
n_heads = 16
head_dim = 64
d_ffn = 2816
vocab = 256
use_byteflow = false
max_seq_len = 1024
max_iter = 8
rank = 64
norm_eps = 0.001
use_kda = true
use_engram = true
use_gr = false
n_experts = 3
jepa_weight = 0.05
jepa_mask_frac = 0.15
jepa_mask_span = 8
dspark_weight = 0.0
dspark_k = 4
dspark_stride = 16

# Hashed n-gram memory (Engram), the 2026-09-27 re-enable. 25_000 rows/order x
# 3 orders x 32 dim; each table rounds UP to a power of two, so what is built is
# 3 x 32 768 x 32 = 3 145 728 memory params. Budget provenance lives in
# configs/small.toml (corrected 2026-10-15): the DeepSeek-Flash operating point
# 26% is real, no published "20-25%" law survived verification (arXiv:2608.30320
# reads 29-41%), and the allocation is swept, not fixed - 500K/order is a ladder
# rung, not this default ("the monopoly shape").
# Measured 2026-10-01 on the instantiated model (`preset_exec`): 3 145 728 of
# 13 065 874 = 24.1%.
engram_rows = 25000
engram_orders = [2, 3, 4]
engram_dim = 32
engram_lam_max = 0.5
