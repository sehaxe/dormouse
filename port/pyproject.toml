[project]
name = "dormouse"
version = "0.0.1"
description = "dormouse PyTorch port — day-one skeleton (config, model, trainer)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bitsandbytes[gpu]>=0.50.2",
    "matplotlib>=3.11.2",
    "sympy>=1.12",
    "torch>=2.13",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# The stack the 2026-10-15 torch spike MEASURED on this card (RTX 5060 Ti,
# sm_120): FLA 0.5.2 on torch 2.13.0+cu129 — the version pair the chunked
# per-channel KDA kernel (`fla.ops.kda.chunk_kda`) was verified to run on.
#   install: uv sync --extra gpu     run: uv run --extra gpu pytest
# The extra is what makes FLA reachable at all; the `torch` pin is in the
# shared lock, so a CPU-only environment installs this wheel and runs it as
# CPU-only (`torch.cuda.is_available()` False → the CUDA gates skip, `fla` is
# absent, and both fused arms fall back COUNTED).
gpu = [
    "torch==2.13.0+cu129",
    "flash-linear-attention==0.5.2",
    "fla-core==0.5.2",
    "bitsandbytes>=0.50.2",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", extra = "gpu" }]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dormouse"]
# The presets are runtime data, not source: `load_preset("small")` must work
# from a wheel with no checkout around it. They land beside `config.py`, which
# is where `config.PACKAGE_PRESET_DIR` looks (the loader's last fallback).
force-include = { "configs" = "dormouse/configs" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `slow` = the inductor/compile gates: 32% of the suite's wall time
# (docs/reviews/2026-11-08-suite-speed.md). Deselect with `-m "not slow"` while
# iterating; the gate still runs everything.
markers = [
    "slow: real inductor compilation / compile-boundary gates",
    # An exact fingerprint of a previous run: a sha256 over logits, a
    # `state_dict` or a launch transcript, or a tuple of counted launches. It
    # fails on any LEGITIMATE re-association (summation order, thread count, a
    # CPU kernel, a new parameter) as readily as on a real change, so it runs in
    # an informational job (`-m pins`) instead of gating a PR. Everything that
    # only claims a ROUTE (flag off → same formula) belongs here.
    "pins: exact sha256/state_dict/launch fingerprint of a previous run; informational, not a PR gate",
]

[project.scripts]
dormouse = "dormouse.cli:main"
