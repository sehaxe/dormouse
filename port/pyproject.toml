[project]
name = "dormouse"
version = "0.0.1"
description = "dormouse PyTorch port — day-one skeleton (config, model, trainer)"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.13"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dormouse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
