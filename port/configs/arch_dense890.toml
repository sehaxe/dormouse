# Arch arm B2: the dense control at the FLOP-matched width, d=890.
#
# B1 (arch_hybrid31) spends the hybrid's saved attention FLOPs on +16% width:
# 3:1 at d=890 is ISO-FLOPs with C0 (dense d=832, 95.0M params, 692.9
# MFLOP/byte; B1 is 692.2). This arm holds B1's parameters fixed (109,947,930
# vs 109,892,835, 0.05%) and gives ALL of them to a plain 12-layer transformer
# at the same d=890. B1 vs B2 is therefore the mechanism at equal budget; B2 vs
# C0 is what the extra parameters buy at +14.2% compute (790.9 vs 692.9).
#
# d=890 = 5 heads × 178 (even head_dim for RoPE), d_ffn=3344 (3.76×d, the
# ratio that matches B1's parameter count). One final CE, the same readout, data
# stream, optimizer and eval window as every other arm.
d_model = 890
n_heads = 5
head_dim = 178
d_ffn = 3344
vocab = 256
max_seq_len = 1024

# 12 UNIQUE pre-LN blocks: the vanilla decoder control, already gated by
# tests/test_block_form.py (mirror_control) at d=304.
block_form = "transformer"
n_layers = 12
max_iter = 1
loop_blocks = 1

use_kda = false
use_csa = false
use_mhc = false
use_attnres = false
use_engram = false
layerrope = false

use_tsct = false
n_experts = 1
moe_topk = 0

bf16 = true
