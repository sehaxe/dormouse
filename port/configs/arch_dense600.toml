# arch_dense600 — the 600M rung of the ratio-law test: same shape family, 22 layers,
# d=1536, so the tsct arm can be run at the SAME r/f ratio as the 275M ladder
# (9%), and the question is whether that same ratio costs the same 5.2%.
#
# (was) # arch_dense275 — the 275M sibling of arch_gated_swiglu, SAME shape family.
#
# Why 275M: it is the smallest scale at which the low-rank bet is worth testing
# (9.2M proved nothing, SCT collapsed at 1.7B), and it fits the card: masters
# bf16 = 4 B/param = 1.1 GB, so a b8-b12 step leaves room for activations.
# Params = 2·256·d + n_layers·(4d² + 3d·d_ffn) = 2·256·1152 + 18·(5.31M + 9.80M)
#        ≈ 0.59M + 272.0M = 272.6M  (the runner prints the exact count).
#
# The gated width keeps the param-neutral identity of the 95M recipe:
# d_ffn = 2·d_ffn_gelu/3 → 3·d·2848 == 2·d·4272.
#
# THIS FILE IS THE CONTROL of the tsct275 A/B; arch_tsct275.toml is the arm.

d_model = 1536
n_heads = 24
head_dim = 64
d_ffn = 3776
d_ffn_gelu = 5664
vocab = 256
max_seq_len = 1024
max_iter = 1
loop_blocks = 1
n_layers = 22

block_form = "transformer"
use_kda = false
use_csa = false
use_mhc = false
use_attnres = false
use_engram = false
layerrope = false

n_experts = 1
moe_topk = 0
use_tsct = false

ffn_gated = true
expert_act = "silu"

bf16 = true
