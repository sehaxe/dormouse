# port mix plan: v7 — the corpus built from the OPEN, classifier-filtered sets.
#
# What changed against v4: the English web share is no longer the raw crawl from
# the local mount (which measured as unfiltered Common Crawl and gave only x1.07
# from our own heuristics, 2026-10-23). It is FineWeb-Edu — the same crawl after
# a teacher-trained educational classifier — plus Cosmopedia (textbook-style
# explanations) and, new as a domain, peS2o open research papers.
#
# Target shares over the 22.2 GB on disk (docs/guides/dataset.md records the
# measured per-domain sizes and the three named source deviations of v4):
#
#   fwedu      42%   FineWeb-Edu, ODC-BY
#   cosmo      10%   Cosmopedia v2, ODC-BY  (explanations, not facts)
#   ru         12%   fineweb-2 rus_Cyrl, ODC-BY
#   code       12%   codeparrot/github-code-clean, Apache-2.0 (still 7 languages:
#                    starcoderdata / Nemotron-CC-Code are gated 401)
#   math        5%   mix4 math (local LaTeX, filtered)
#   finemath    4%   finemath-3plus, ODC-BY (math web, quality filtered)
#   science     5%   peS2o v2, ODC-BY — the first real science-prose domain here
#   wiki_en     4%   mix4
#   wiki_ru     2%   mix4
#   reasoning   2%   mix4 CoT traces
#   instruct    1%   mix4 clean pairs
#   rudialog    1%   mix4
#
# S1 prose, S2 adds code+math+science, S3 is the decay stage: math/code/science
# up, instructions weighted up. Weights are a probability vector per stage
# (mixer.py refuses otherwise).

max_epochs = 4.0
seed = 20261027

[sources]
fwedu = "/home/sehaxe/dormouse/data_local/best/fwedu.bin"
cosmo = "/home/sehaxe/dormouse/data_local/best/cosmo.bin"
