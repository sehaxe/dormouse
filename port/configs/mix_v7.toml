science = "/home/sehaxe/dormouse/data_local/best/science.bin"
code = "/home/sehaxe/dormouse/data_local/mix4/code.bin"
wiki_en = "/home/sehaxe/dormouse/data_local/mix4/wiki_en.bin"
wiki_ru = "/home/sehaxe/dormouse/data_local/mix4/wiki_ru.bin"
reasoning = "/home/sehaxe/dormouse/data_local/mix4/reasoning.bin"
instruct = "/home/sehaxe/dormouse/data_local/mix4/instruct.bin"
rudialog = "/home/sehaxe/dormouse/data_local/mix4/rudialog.bin"

