# flagship3_dense — a plain 12-layer transformer at the flagship's compute bill.
#
# Rationale (measured, 2026-11-06):
#   * a 13.5M vanilla decoder beat our 102.7M KDA/CSA/mHC/Engram block by 0.126 BPB
#     at equal bytes on all eight eval windows (docs/records/reviews/2026-11-06-control-transformer.md);
#   * loops lose at iso-FLOPs: each recurrence is worth 0.46 of a unique block
#     (arXiv 2604.21106v3), so 1 unique layer x 3 iterations is 14% of a 12-layer
#     model at the same layer-passes (docs/records/research/2026-11-06-depth-recurrence.md);
#   * nothing beats a dense transformer at <=200M params in a compute-matched test
#     (docs/records/research/2026-11-06-architecture-at-100m.md).
#
# THIS FILE IS THE MODEL, NOT THE RUN (2026-11-08 kernel audit §1). As a flat
# preset it resolves to `seq_len=512, ns_dtype=fp32, muon_state_dtype=fp32,
# muon_lr_mult=1.0, grad_accum=1, ckpt_every=100` — measured at 283-290 ms/step.
# The 56 kB/s recipe every number on record uses is this file PLUS six flags
# (`ns_dtype=bf16`, `muon_state_dtype=bf16`, `muon_lr_mult=12`, `seq_len=1024`,
# `grad_accum`, `ckpt_every`), applied by `scripts/recipe_ladder.sh`,
# `scripts/train_budget.sh` and `scripts/train_csa8k.sh`. Train keys cannot live
# in this file (the preset parser is model-only by design), so the script IS the
# recipe; run `dormouse train` with no `--set` and you have trained a different,
# slower, LR-starved arm.
#
# Sizing: this is a BYTE-level dense arm (1 byte = 1 token), so the old
# flagship's 4.485 B/patch factor does not apply. The full fwd+bwd bill at
# b1 x s1024 is 691.37 MFLOP/byte (block 567.41 + attention core 122.68 +
# head 1.28), ~5.03x the old flagship's measured 137.42. This arm is therefore
# NOT compute-matched to the KDA flagship; any quality comparison must carry
# the FLOPs ratio. Exact number printed by `port/scripts/mod_ledger.py` (the
# comment used to name a `scripts/flops_ledger.py`, which is not on this
# branch).

d_model = 832
n_heads = 13
head_dim = 64
d_ffn = 3072
vocab = 256
max_seq_len = 1024
max_iter = 1
loop_blocks = 1
n_layers = 12

block_form = "transformer"
use_kda = false
use_csa = false
use_mhc = false
use_attnres = false
use_engram = false
layerrope = false

n_experts = 1
moe_topk = 0
use_tsct = false

bf16 = true
