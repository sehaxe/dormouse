# arch_tsct275_r128 — the rank ladder's second rung: same shape as tsct275, rank 128
# instead of 64. FFN params/layer 768,192 -> 1,536,000 (vs dense 9,842,688), so it
# is still 6.4x cheaper and the question is how much of the +0.466 BPB at r=64
# the extra rank recovers.
#
# This is the mechanism test, not the reinvestment test: everything except the
# FFN's parameterisation is identical to the control, so any delta is the cost
# of rank-64 factorisation alone. If it holds, the freed parameters are
# reinvested (wider d / deeper L) and re-measured against the same control.
#
# Why 275M: it is the smallest scale at which the low-rank bet is worth testing
# (9.2M proved nothing, SCT collapsed at 1.7B), and it fits the card: masters
# bf16 = 4 B/param = 1.1 GB, so a b8-b12 step leaves room for activations.
# Params = 2·256·d + n_layers·(4d² + 3·(d·r + r + r·f)) = 0.59M + 18·6.08M
#        = 110,052,864  (+84,096 of norms the formula above omits). The dense
#        control of the same shape is 273,393,792 — the 12.8x smaller FFN is
#        the whole difference.
#
# The gated width keeps the param-neutral identity of the 95M recipe:
# d_ffn = 2·d_ffn_gelu/3 → 3·d·2848 == 2·d·4272.
#
# THE ARM. The control is arch_dense275.toml (same shape, dense gated FFN).

d_model = 1152
n_heads = 18
head_dim = 64
d_ffn = 2848
rank = 128
ffn_rank_gate = 0
ffn_rank_down = 0
d_ffn_gelu = 4272
vocab = 256
max_seq_len = 1024
max_iter = 1
loop_blocks = 1
n_layers = 18

block_form = "transformer"
use_kda = false
use_csa = false
use_mhc = false
use_attnres = false
use_engram = false
layerrope = false

n_experts = 1
moe_topk = 0
use_tsct = false
ffn_form = "tsct"

ffn_gated = true
expert_act = "silu"

bf16 = true
