# The live m400b recipe, copied from `checkpoints/m400b/m400b.config.toml`
# (2026-11-05, the run the card is training). It lives here because the
# checkpoint directory is gitignored and `tests/test_full_graph_m400b.py` /
# `scripts/bench_graph.py` must be able to name the exact arm set the capture
# gate covers: dropless grouped-GEMM MoE (`moe_capacity=0`, `moe_kernel=triton`),
# the prop LFB controller, the fused combine, the epoch-keyed bank, paper
# LayerRoPE, CSA, mHC and AttnRes.
#
# Only the MODEL half is here: `load_run`'s preset layer is flat, and the
# snapshot's TRAIN half is read from disk by the bench (`--snapshot`) so the
# measured run and its checkpoint cannot drift. The capture tests pass the
# handful of train keys they need explicitly.

