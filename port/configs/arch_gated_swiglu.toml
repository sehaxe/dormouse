# arch_gated_swiglu — flagship3_dense's plain 12-layer transformer with a SwiGLU FFN.
#
# THIS FILE IS AN ARM, NOT THE MODEL: `ffn_gated=true` swaps the live
# `TransformerBlock`'s `gelu(fc(x))@fc2^T` for `fc2(silu(gate(x))·up(x))`.
# `d_ffn_gelu=3072` is the width the CONTROL (`flagship3_dense.toml`) declares
# and the width this arm is neutral against; the gated width is
# d_ffn = 2·d_ffn_gelu/3 = 2048, so `3·d·f` = 3·832·2048 = 5,111,808 == the
# control's `2·832·3072` — EXACTLY equal, +0.00% (`validate_ffn` allows 2%).
# Everything else is `flagship3_dense.toml` verbatim; that file's train-recipe
# notes apply here too (the preset is model-only, the script is the recipe).

d_model = 832
n_heads = 13
head_dim = 64
d_ffn = 2048
d_ffn_gelu = 3072
vocab = 256
max_seq_len = 1024
max_iter = 1
loop_blocks = 1
n_layers = 12

block_form = "transformer"
use_kda = false
use_csa = false
use_mhc = false
use_attnres = false
use_engram = false
layerrope = false

n_experts = 1
moe_topk = 0
use_tsct = false

ffn_gated = true
expert_act = "silu"

bf16 = true
