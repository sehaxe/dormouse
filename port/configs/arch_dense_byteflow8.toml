# arch_dense_byteflow8 — flagship3_dense's 12 dense blocks, run over PATCHES.
#
# The A/B the 2026-11-06 control makes possible: the verdict that killed the
# KDA/mHC/Engram block was measured against a dense 12-layer stack, and byte
# patching (the one mechanism with a measured 2.04x step-speed and -0.3725 BPB
# at 199M) was welded to the losing block. This config moves the patch compute
# unit under the WINNING stack and changes nothing else:
#
#   bytes [b, 1024] -> conv codec (357k-520k params, ~2% of the stack's MACs)
#     -> 128 patch latents [b, 128, d_global] -> in_proj -> 12 dense blocks
#     [b, 128, 832] -> out_proj -> decode -> 1024 byte logits -> per-byte CE.
#
# Sizing is flagship3_dense's stack (94,608,384 params in its 12 blocks);
# the codec (419,776) + the two d_global<->d_model projections (2,555,904) +
# the final norm (832) make 97,584,896. The byte embedding and lm_head are NOT
# built — the codec is both ends — so no parameter in this tree is dead. The
# per-byte stack bill is 6N/8 (not 6N/1), i.e. the question this arm answers:
# does the deep stack still learn when it sees 8-byte units instead of bytes?
#
# byteflow_k_tokens MUST be max_seq_len // byteflow_patch_bytes: with
# byte_patch the stack runs every patch (K=P) so the strict prefix-causality
# gate holds at every byte offset. See docs/records/reviews/2026-11-07-byteflow-dense.md.

d_model = 832
n_heads = 13
head_dim = 64
d_ffn = 3072
vocab = 256
max_seq_len = 1024
max_iter = 1
loop_blocks = 1
n_layers = 12

block_form = "transformer"
use_kda = false
use_csa = false
use_mhc = false
use_attnres = false
use_engram = false
layerrope = false

n_experts = 1
moe_topk = 0
use_tsct = false

bf16 = true

# The patch compute unit, under the dense stack this time.
use_byteflow = true
byte_patch = true
byteflow_codec = "conv"
byteflow_patch_bytes = 8
byteflow_k_tokens = 128  # 1024 / 8: one latent per patch, no rate chunking
