# arch_gated_situ — the same arm as arch_gated_swiglu with Kimi K3's SiTU-GLU.
#
# `expert_act="situ"` is arXiv 2607.24653 Eq. 12:
#   [β1·tanh(g/β1)·σ(g)] ⊙ [β2·tanh(u/β2)],  β1=4, β2=25  (‖·∞ ≤ 100).
# The only difference from arch_gated_swiglu.toml is that one field — the width
# (`d_ffn=2048` = 2·3072/3), the bill (5,111,808 FFN weights, exactly the
# control's) and the geometry are identical, so an A/B reads the activation.

d_model = 832
n_heads = 13
head_dim = 64
d_ffn = 2048
d_ffn_gelu = 3072
vocab = 256
max_seq_len = 1024
max_iter = 1
loop_blocks = 1
n_layers = 12

block_form = "transformer"
use_kda = false
use_csa = false
use_mhc = false
use_attnres = false
use_engram = false
layerrope = false

n_experts = 1
moe_topk = 0
use_tsct = false

ffn_gated = true
expert_act = "situ"

bf16 = true
