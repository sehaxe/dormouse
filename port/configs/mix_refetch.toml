# mix_refetch — the 2026-11-08 recovery plan.
#
# The merge deleted `data_local/` (docs/records/reviews/2026-11-08-merge-incident.md).
# These six sources are what `port/scripts/refetch_pretrain.py` and
# `fetch_mix_sources.py` wrote back, at the paths below. It is NOT mix_v7: the
# eval window is gone too, so every number measured on this plan is a NEW
# number and must say so.
#
# One stage, weights sum to 1.0. The shares keep fwedu dominant because that is
# the domain the held-out window was carved from: `fwedu.bin` was split at a
# document separator into `fwedu_train.bin` (the head, the source here) and
# `fwedu_eval.bin` (the tail, 8 MiB, a file NO source reads — the overlap gate
# compares paths, so a window inside a source is not held out).

max_epochs = 4.0
seed = 20261027

[sources]
