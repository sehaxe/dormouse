# mix_v7 with `doc_masking=true` — the three sources whose boundaries cannot be
# recovered are REMOVED, not approximated.
#
# `docmask_audit.py` on mix_v7: 9/12 sources REAL (23.17 GB, 96.8%); wiki_en,
# reasoning and rudialog are REFUSED-BY-BUILDER (762 MB, 3.2%) because a mix4
# shard is a flat concatenation of many records with no record token, so the
# only recoverable "boundary" is the 6.3 MB file seam — exactly the BOGUS
# sidecar this lane exists to delete. The trainer refuses the whole mixture on
# a missing sidecar, so a doc-masked run uses THIS plan. The stage weights are
# mix_v7's renormalized over the remaining sources (same relative shares inside
# each stage), so the run differs from mix_v7 only by the three removed
# sources, never by a changed ratio among the rest.
#
# Build the sidecars first (the parquet sources replay; `--source-dir` is for
# whole-file shards):
#
#   for d in code math wiki_ru instruct; do
#     uv run --with pyarrow port/scripts/build_doc_sidecar.py \
#       --bin data_local/mix4/$d.bin --domain $d
#   done
#
# and verify with `uv run python port/scripts/docmask_audit.py`.

