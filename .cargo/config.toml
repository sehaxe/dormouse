# CUDA trainer is built WITHOUT the cpu feature so the GPU binary never
# links OpenBLAS (burn-ndarray's blas backend); no LD_LIBRARY_PATH needed.
[alias]
build-train = "build --release -p dormouse-cli --bin train --no-default-features --features cuda"
check-train = "check -p dormouse-cli --bin train --no-default-features --features cuda"
# ITERATION PATH. `build-train` costs 4-6 min (release + thin LTO across 753
# crates) and that is the price of a binary you RUN FOR HOURS. It is the
# wrong tool for "does it compile" or "run 20 steps and read one counter":
# a release build was spent 4 times today answering questions `check` answers
# in seconds. Use check-train for type errors and build-probe for short runs.
build-probe = "build -p dormouse-cli --bin train --no-default-features --features cuda"
test-core = "test -p dormouse-core --lib"
test-data = "test -p dormouse-data --lib"
test-train = "test -p dormouse-train --lib"

# sccache: ABSOLUTE path under `build.rustc-wrapper`, NOT under `[env]`.
#
# `[env] RUSTC_WRAPPER` is a NO-OP. Cargo reads RUSTC_WRAPPER out of its OWN
# environment when it starts, then applies `[env]` to the processes it spawns -
# too late to affect its own decision. Measured on this tree: with the wrapper
# only in `[env]`, `cargo check -p dormouse-data` after a `touch` gave sccache
# 0 requests; with the identical value exported in the real environment, the
# same command gave 7. 0 requests, 0 hits, cold cache, while 10 rustc
# processes ran - and no error anywhere to say why.
#
# It matters here: the vendored burn-fused crates are PATH deps, so their
# fingerprint is per-worktree and every fresh worktree recompiles 753 packages
# from source. A cold worktree build costs >= 23 min (AGENTS.md 2.5). That is
# the exact case a compile cache exists for.
[build]
rustc-wrapper = "/home/sehaxe/.cargo/bin/sccache"

[env]
SCCACHE_CACHE_SIZE = "20G"
# cudarc's build script dies on CUDA toolkit 13.4 without a pinned version;
# every fresh target dir needs this (set once here instead of per shell).
CUDARC_CUDA_VERSION = "12050"

[target.x86_64-unknown-linux-gnu]
# mold 2.42 (installed 2026-09-22): fastest linker for burn-sized trees.
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
