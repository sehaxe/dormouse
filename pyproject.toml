[project]
name = "dormouse"
version = "0.0.1"
description = "A byte-level Mixture-of-Experts language model trained end to end on one consumer GPU."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "sehaxe", email = "sehaxe@users.noreply.github.com" }]
keywords = ["language-model", "mixture-of-experts", "byte-level", "pytorch", "single-gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "bitsandbytes[gpu]>=0.50.2",
    "matplotlib>=3.11.2",
    "sympy>=1.12",
    "torch>=2.13",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://github.com/sehaxe/dormouse"
Documentation = "https://sehaxe.github.io/dormouse/"
Repository = "https://github.com/sehaxe/dormouse"
Changelog = "https://github.com/sehaxe/dormouse/commits/main"

[project.optional-dependencies]
# The stack the 2026-10-15 torch spike MEASURED on this card (RTX 5060 Ti,
# sm_120): FLA 0.5.2 on torch 2.13.0+cu129 — the version pair the chunked
# per-channel KDA kernel (`fla.ops.kda.chunk_kda`) was verified to run on.
#   install: uv sync --extra gpu     run: uv run --extra gpu pytest
# The extra is what makes FLA reachable at all; the `torch` pin is in the
# shared lock, so a CPU-only environment installs this wheel and runs it as
# CPU-only (`torch.cuda.is_available()` False → the CUDA gates skip, `fla` is
# absent, and both fused arms fall back COUNTED).
gpu = [
    "torch==2.13.0+cu129",
    "flash-linear-attention==0.5.2",
    "fla-core==0.5.2",
    "bitsandbytes>=0.50.2",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu129", extra = "gpu" }]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dormouse"]

# The sdist is the source, not the working tree: node_modules, .bulba notes,
# checkpoints and the docs trees stay out. Without this list hatchling packed
# docs-site/node_modules into a 196 MB tarball (measured 2026-10-19).
[tool.hatch.build.targets.sdist]
include = [
    "src/dormouse",
    "tests",
    "pyproject.toml",
    "uv.lock",
    "README.md",
    "README.ru.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The documentation trees carry python in markdown blocks and in working
# notes; they are documents, not the package. Lint scope: src/, tests/,
# scripts/, tools/.
extend-exclude = ["docs", "docs-site", "research", ".bulba"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The register's reason strings are prose records; wrapping them would churn
# the record to satisfy a ruler.
"tools/check_doc_refs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.scripts]
dormouse = "dormouse.cli:main"
