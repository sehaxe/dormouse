[package]
name = "burn-rmsnorm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RMS Normalization for Burn (LLaMA/Mistral/Qwen/DeepSeek/Gemma)"
keywords = ["burn", "rmsnorm", "normalization", "llm"]
repository = "https://github.com/sehaxe/burn-rmsnorm"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]
cuda = ["dep:burn-cuda", "dep:burn-cubecl", "dep:cubecl", "dep:burn-autodiff", "burn/std", "burn/cuda", "burn-tensor/cuda", "burn/extension", "burn/autodiff"]
# The same fused kernel through cubecl-wgpu's WGSL pipeline (AMD/Intel/lavapipe).
# The launch is runtime-agnostic — CubeTensor erases the runtime and the DEVICE
# picks it — so this feature changes only which runtime the graph carries.
wgpu = ["dep:burn-cubecl", "dep:cubecl", "burn/std", "burn/wgpu", "burn-tensor/wgpu", "burn/extension"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }
burn-autodiff = { workspace = true, optional = true }
burn-cuda = { workspace = true, optional = true }
burn-cubecl = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn = { workspace = true, features = ["ndarray", "std"] }
futures-lite = { workspace = true }

# The gate that did not exist while the kernel was broken: an integration test
# that ASSERTS THE ARM WAS TAKEN and compares the fused answer to a scalar f64
# definition, and one that pins the dispatch guard which keeps the backward-less
# kernel away from an autodiff device. `required-features` is what stops cargo
# building an empty target that prints a green `running 0 tests ... ok`.
[[test]]
name = "fused_kernel_gate"
required-features = ["cuda"]

# The same kernel against the tier-(a) upstream fixture (torch ATen +
# flash-linear-attention), with the seam counters pinned per case.
[[test]]
name = "rmsnorm_kernel_cuda"
required-features = ["cuda"]

# The bisect instrument, and a PERMANENT one: each `#[test]` launches a
# progressively richer kernel in its own process. See the file's header for what
# each rung isolates; the rung that reproduced the lowering failure is the
# minimal reproducer this crate is pinned by.
[[test]]
name = "lower_probe"
required-features = ["cuda"]

# The gate the dispatch guard made impossible: the fused kernel as ONE
# autodiff node on the trainer's backend, gradients vs the tensor path, the
# counter that says the node arm ran, and the kill switch's counted decline.
[[test]]
name = "autodiff_node_cuda"
required-features = ["cuda"]

[[test]]
name = "d2_isolate"
required-features = ["cuda"]

# The cross-vendor gate: the SAME kernel lowered to WGSL by cubecl-wgpu and run
# on a CPU-adapter Vulkan device (lavapipe). Needs a software/CPU Vulkan ICD
# (Arch: `pacman -S vulkan-swrast`); absent, the adapter request fails loudly —
# the test never skips.
[[test]]
name = "rmsnorm_kernel_wgpu"
required-features = ["wgpu"]
