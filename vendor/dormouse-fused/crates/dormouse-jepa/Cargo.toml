[package]
name = "dormouse-jepa"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JEPA for Burn — data2vec 2.0-style EMA teacher + masked latent prediction"
keywords = ["burn"]
repository = "https://github.com/sehaxe/burn-jepa"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn = { workspace = true, features = ["ndarray", "std"] }
