[package]
name = "burn-es"
version = "0.1.0"
edition = "2021"
license = "MIT" # README badge + License section say MIT; keep in sync
description = "Evolution Strategies for Burn"
keywords = ["burn"]
readme = "README.md"
repository = "https://github.com/sehaxe/burn-es"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn = { workspace = true, features = ["ndarray", "std"] }
