[package]
name = "dormouse-muon-plus"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Muon+ (arXiv 2602.21545) for Burn — NS polar orthogonalization plus one post-polar row/col normalization, hybrid AdamW fallback for non-matrix params"
keywords = ["burn", "muon", "optimizer", "newton-schulz", "orthogonalization"]
repository = "https://github.com/sehaxe/burn-muon-plus"
homepage = "https://github.com/sehaxe/burn-muon-plus"
documentation = "https://docs.rs/burn-muon-plus"
readme = "README.md"

[features]
cuda = ["dep:burn-cuda", "dep:burn-cubecl", "dep:cubecl", "burn/cuda", "burn-tensor/cuda"]
default = ["std"]
std = ["burn/std", "burn-tensor/std", "burn/optim"]

[dependencies]
burn = { workspace = true, features = ["std", "extension", "optim"] }
burn-tensor = { workspace = true }
burn-pack = { workspace = true }

derive-new = { workspace = true }
serde = { workspace = true, features = ["derive"] }
burn-cuda = { workspace = true, optional = true }
burn-cubecl = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
burn = { workspace = true, features = ["ndarray"] }
burn-autodiff = { workspace = true, features = ["std"] }
burn-ndarray = { workspace = true, features = ["blas-openblas"] }

# A CUDA-only test target. Without this the binary is still built on the CPU
# backend and reports `running 0 tests ... ok`, which is a green line over a
# test that does not exist. Not building the target is the honest shape.
[[test]]
name = "bf16_matmul"
required-features = ["cuda"]

# Tier-(a) oracle against the Muon+ AUTHORS' own code
# (K1seki221/MuonPlus @ 8a9ace12, pinned under tests/oracle/upstream/). No
# feature gate: the expected values are committed bytes, so this runs on CPU in
# CI with no Python present. The target MUST be declared - an undeclared test
# file is not built at all and cargo prints nothing, which is how
# `tools/test_targets.py` came to exist.
[[test]]
name = "muon_oracle"

[package.metadata.docs.rs]
all-features = true
