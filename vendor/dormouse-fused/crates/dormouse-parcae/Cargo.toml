[package]
name = "dormouse-parcae"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stable looping via spectral retention for Burn"
keywords = ["burn"]
repository = "https://github.com/sehaxe/burn-parcae"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn = { workspace = true, features = ["ndarray", "std"] }
