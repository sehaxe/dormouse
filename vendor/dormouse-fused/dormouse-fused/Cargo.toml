[package]
name = "dormouse-fused"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Community fused-kernel ecosystem for Burn: 100+ technologies, faster than naive chains, less memory, any hardware"
keywords = ["burn", "fused", "kernels", "attention", "quantization"]
# The integration story is the readme, not the fork's dev notes: crates.io
# renders exactly this file for anyone who adds the dependency.
readme = "INTEGRATION.md"

# --- generated by tools/gen_facade.py ---
[features]
default = ["std"]

# every member ships `std`; the facade default is exactly this.
# a member default feature NOT listed here is one the facade does not
# restore (see NOT_PUBLIC) - its owner must require it explicitly.
autodiff = [
    "dormouse-attnres/autodiff",
    "dormouse-bitnet/autodiff",
    "dormouse-gdn2/autodiff",
    "dormouse-kda/autodiff",
    "dormouse-mhc/autodiff",
    "dormouse-rope/autodiff",
    "dormouse-sct/autodiff",
    "dormouse-situ/autodiff",
    "dep:burn-autodiff",
]

cuda = [
    "dormouse-attnres/cuda",
    "dormouse-bitnet/cuda",
    "dormouse-gdn2/cuda",
    "dormouse-kda/cuda",
    "dormouse-mhc/cuda",
    "dormouse-muon-plus/cuda",
    "dormouse-rmsnorm/cuda",
    "dormouse-rope/cuda",
    "dormouse-sct/cuda",
    "dormouse-situ/cuda",
    "dormouse-spectral/cuda",
    "dormouse-swiglu/cuda",
    "dep:burn-cuda",
]

serde = [
    "dormouse-sct/serde",
]

# every member ships `std`; the facade default is exactly this
std = [
    "dormouse-attnres/std",
    "dormouse-bitnet/std",
    "dormouse-dspark/std",
    "dormouse-eggroll/std",
    "dormouse-engram/std",
    "dormouse-es/std",
    "dormouse-gdn2/std",
    "dormouse-jepa/std",
    "dormouse-kda/std",
    "dormouse-mhc/std",
    "dormouse-mor/std",
    "dormouse-muon-plus/std",
    "dormouse-parcae/std",
    "dormouse-ptrn/std",
    "dormouse-rmsnorm/std",
    "dormouse-rope/std",
    "dormouse-sct/std",
    "dormouse-situ/std",
    "dormouse-spectral/std",
    "dormouse-swiglu/std",
]

training = [
    "dormouse-dspark/training",
]

[dependencies]
dormouse-attnres = { path = "../crates/dormouse-attnres", default-features = false }
dormouse-bitnet = { path = "../crates/dormouse-bitnet", default-features = false }
dormouse-dspark = { path = "../crates/dormouse-dspark", default-features = false }
dormouse-eggroll = { path = "../crates/dormouse-eggroll", default-features = false }
dormouse-engram = { path = "../crates/dormouse-engram", default-features = false }
dormouse-es = { path = "../crates/dormouse-es", default-features = false }
dormouse-gdn2 = { path = "../crates/dormouse-gdn2", default-features = false }
dormouse-jepa = { path = "../crates/dormouse-jepa", default-features = false }
dormouse-kda = { path = "../crates/dormouse-kda", default-features = false }
dormouse-mhc = { path = "../crates/dormouse-mhc", default-features = false }
dormouse-mor = { path = "../crates/dormouse-mor", default-features = false }
dormouse-muon-plus = { path = "../crates/dormouse-muon-plus", default-features = false }
dormouse-parcae = { path = "../crates/dormouse-parcae", default-features = false }
dormouse-ptrn = { path = "../crates/dormouse-ptrn", default-features = false }
dormouse-rmsnorm = { path = "../crates/dormouse-rmsnorm", default-features = false }
dormouse-rope = { path = "../crates/dormouse-rope", default-features = false }
dormouse-sct = { path = "../crates/dormouse-sct", default-features = false }
dormouse-situ = { path = "../crates/dormouse-situ", default-features = false }
dormouse-spectral = { path = "../crates/dormouse-spectral", default-features = false }
dormouse-swiglu = { path = "../crates/dormouse-swiglu", default-features = false }
burn-cuda = { workspace = true, optional = true }
burn-autodiff = { workspace = true, optional = true }

[dev-dependencies]
# NdArray only: the facade's tests are CPU-only by design, so they run
# next to a training run and need no GPU. `autodiff` is a facade
# feature (it re-exports burn-autodiff for the members), not a test dep.
burn = { workspace = true, features = ["ndarray", "extension"] }
burn-ndarray = { workspace = true, features = ["blas-openblas"] }

# --- end generated ---

[lib]
path = "src/lib.rs"
