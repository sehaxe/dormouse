[package]
name = "burn-fused"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Community fused-kernel ecosystem for Burn: 100+ technologies, faster than naive chains, less memory, any hardware"
keywords = ["burn", "fused", "kernels", "attention", "quantization"]
# The integration story is the readme, not the fork's dev notes: crates.io
# renders exactly this file for anyone who adds the dependency.
readme = "INTEGRATION.md"

# --- generated by tools/gen_facade.py ---
[features]
default = ["std"]

# every member ships `std`; the facade default is exactly this.
# a member default feature NOT listed here is one the facade does not
# restore (see NOT_PUBLIC) - its owner must require it explicitly.
autodiff = [
    "burn-attnres/autodiff",
    "burn-bitnet/autodiff",
    "burn-gdn2/autodiff",
    "burn-kda/autodiff",
    "burn-mhc/autodiff",
    "burn-rope/autodiff",
    "burn-situ/autodiff",
    "dep:burn-autodiff",
]

cuda = [
    "burn-attnres/cuda",
    "burn-bitnet/cuda",
    "burn-gdn2/cuda",
    "burn-kda/cuda",
    "burn-mhc/cuda",
    "burn-muon-plus/cuda",
    "burn-rmsnorm/cuda",
    "burn-rope/cuda",
    "burn-situ/cuda",
    "burn-spectral/cuda",
    "burn-swiglu/cuda",
    "dep:burn-cuda",
]

# every member ships `std`; the facade default is exactly this
std = [
    "burn-attnres/std",
    "burn-bitnet/std",
    "burn-byteflow/std",
    "burn-dspark/std",
    "burn-eggroll/std",
    "burn-engram/std",
    "burn-gdn2/std",
    "burn-jepa/std",
    "burn-kda/std",
    "burn-mhc/std",
    "burn-mor/std",
    "burn-muon-plus/std",
    "burn-parcae/std",
    "burn-ptrn/std",
    "burn-rmsnorm/std",
    "burn-rope/std",
    "burn-situ/std",
    "burn-spectral/std",
    "burn-swiglu/std",
]

training = [
    "burn-dspark/training",
]

wgpu = [
    "burn-rmsnorm/wgpu",
]

[dependencies]
burn-attnres = { path = "../crates/burn-attnres", default-features = false }
burn-bitnet = { path = "../crates/burn-bitnet", default-features = false }
burn-byteflow = { path = "../crates/burn-byteflow", default-features = false }
burn-dspark = { path = "../crates/burn-dspark", default-features = false }
burn-eggroll = { path = "../crates/burn-eggroll", default-features = false }
burn-engram = { path = "../crates/burn-engram", default-features = false }
burn-gdn2 = { path = "../crates/burn-gdn2", default-features = false }
burn-jepa = { path = "../crates/burn-jepa", default-features = false }
burn-kda = { path = "../crates/burn-kda", default-features = false }
burn-mhc = { path = "../crates/burn-mhc", default-features = false }
burn-mor = { path = "../crates/burn-mor", default-features = false }
burn-muon-plus = { path = "../crates/burn-muon-plus", default-features = false }
burn-parcae = { path = "../crates/burn-parcae", default-features = false }
burn-ptrn = { path = "../crates/burn-ptrn", default-features = false }
burn-rmsnorm = { path = "../crates/burn-rmsnorm", default-features = false }
burn-rope = { path = "../crates/burn-rope", default-features = false }
burn-situ = { path = "../crates/burn-situ", default-features = false }
burn-spectral = { path = "../crates/burn-spectral", default-features = false }
burn-swiglu = { path = "../crates/burn-swiglu", default-features = false }
burn-cuda = { workspace = true, optional = true }
burn-autodiff = { workspace = true, optional = true }

[dev-dependencies]
# NdArray only: the facade's tests are CPU-only by design, so they run
# next to a training run and need no GPU. `autodiff` is a facade
# feature (it re-exports burn-autodiff for the members), not a test dep.
burn = { workspace = true, features = ["ndarray", "extension"] }
burn-ndarray = { workspace = true, features = ["blas-openblas"] }

# --- end generated ---

[lib]
path = "src/lib.rs"
