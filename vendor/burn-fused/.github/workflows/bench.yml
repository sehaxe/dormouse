name: bench

# Performance regression gate. Runs the fused-kernel benchmarks on the GPU
# self-hosted runner (the 3090 box), compares against committed baselines,
# and fails the PR when a fused kernel regresses by more than 20%.
#
# Self-hosted runner labels: gpu, linux. Add a runner on your 3090 machine:
#   gh runner register --labels gpu,linux
# Needs CUDA toolchain + `rustup default stable`.

on:
  pull_request:
    paths: ["crates/**", "benches/**"]
  workflow_dispatch:
    inputs:
      update-baselines:
        description: "Re-run and commit new baselines instead of checking"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  perf:
    runs-on: [self-hosted, gpu, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build + run fused benchmarks (bare CUDA backend)
        run: cargo run -p burn-fused-benches --release 2>/dev/null > /tmp/bench.json

      - name: Show results
        run: python3 -m json.tool /tmp/bench.json

      - name: Update baselines (manual trigger only)
        if: inputs.update-baselines == true
        run: |
          mkdir -p bench
          cp /tmp/bench.json bench/baselines.json
          git config user.name "bench-bot"
          git config user.email "bench@users.noreply.github.com"
          git add bench/baselines.json
          git commit -m "bench: update baselines $(date +%F)"
          git push

      - name: Check for regressions vs baselines
        if: inputs.update-baselines != true
        run: python3 benches/check.py /tmp/bench.json bench/baselines.json 0.20
