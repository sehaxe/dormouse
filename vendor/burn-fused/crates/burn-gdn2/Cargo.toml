[package]
name = "burn-gdn2"
version = "0.7.5"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Gated DeltaNet 2 - linear recurrent token mixer with channel-wise erase/write gates"
repository = "https://github.com/sehaxe/burn-gdn2"
homepage = "https://github.com/sehaxe/burn-gdn2"
keywords = ["burn", "gdn2", "linear-attention", "recurrent", "transformer"]
readme = "README.md"
exclude = ["__pycache__/", "TODO.md", "Cargo.lock", "target/"]

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]
autodiff = ["burn/autodiff", "burn-tensor/std", "dep:burn-autodiff"]
cuda = ["dep:burn-cuda", "dep:burn-cubecl", "dep:cubecl", "burn/cuda", "burn-tensor/cuda"]
binary-tests = []

[dependencies]
burn = { workspace = true, features = ["extension"] }
burn-nn = { workspace = true }
burn-tensor = { workspace = true }
burn-autodiff = { workspace = true, optional = true, features = ["std"] }
burn-cuda = { workspace = true, optional = true }
burn-cubecl = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true, features = ["std"] }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn-cuda = { workspace = true }
burn-autodiff = { workspace = true }
# The probe must install the same pool the trainer installs, and
# `MemoryPoolsConfig` is not re-exported by the `cubecl` meta-crate. Pinned to
# the same `0.11.0-pre.*` line `cubecl` resolves to, not `workspace = true`:
# the fork's root manifest is shared and must not be edited from a leaf crate.
cubecl-runtime = { version = "0.11.0-pre.3", default-features = false, features = [
    "std",
] }
burn = { workspace = true, features = ["ndarray", "autodiff", "cuda", "extension"] }
half = "2"

# Sixteen of this crate's twenty test targets are gated on a non-default
# feature, and NONE of them declared `required-features`. So the default cell
# built every one of them, compiled the file away with its `#![cfg]`, and
# printed a green `running 0 tests ... ok` - sixteen of them. `ops_batched_
# grad_cuda.rs` is in that list, and it is one of the tests that would decide
# whether the attention arm trains at all (AGENTS.md 3.2/3.3), so the suite
# read as green while the arm's gradient was never checked on the default cell.
#
# `required-features` is what stops cargo building the empty target at all, and
# it is needed ALONGSIDE the file-level `#![cfg]`, not instead of it: either one
# alone still yields the misleading 0/0 line (243a003). Each list below is the
# union of the features the file's own cfg attributes name - a target that
# required less than the file needs would build, report green, and drop a gated
# arm. `tools/test_targets.py` fails if a gated file appears without one.
#
# The `bench_*` and `*_bench_*` targets are timings, not checks, and the files
# say so (`--release` is not optional). They are `[[test]]` targets only because
# cargo auto-discovers `tests/*.rs` and offers no way to opt out other than
# dropping the file, which would be a bigger change than the defect warrants.
# Run them with `--release` or by naming the target.
[[test]]
name = "alloc_probe"
required-features = ["cuda", "autodiff"]

[[test]]
name = "autodiff_bwd_f64"
required-features = ["autodiff"]

[[test]]
name = "autodiff_chunk"
required-features = ["autodiff"]

[[test]]
name = "autodiff_cuda_gate"
required-features = ["cuda", "autodiff"]

[[test]]
name = "autodiff_nested_balanced"
required-features = ["autodiff"]

[[test]]
name = "bench_cuda"
required-features = ["cuda"]

[[test]]
name = "bench_fused_bwd"
required-features = ["cuda", "autodiff"]

[[test]]
name = "bench_tracks"
required-features = ["cuda", "autodiff"]

[[test]]
name = "bench_train_cuda"
required-features = ["cuda", "autodiff"]

[[test]]
name = "fused_adjoint_f64"
required-features = ["cuda", "autodiff"]

[[test]]
name = "fused_adjoint_vs_ops"
required-features = ["cuda", "autodiff"]

[[test]]
name = "fused_chunk_verify"
required-features = ["cuda", "autodiff"]

[[test]]
name = "fused_launch_count"
required-features = ["cuda", "autodiff"]

[[test]]
name = "fused_permuted_view"
required-features = ["cuda", "autodiff"]

[[test]]
name = "lowp_bf16_cuda"
required-features = ["cuda"]

[[test]]
name = "ops_batched_autodiff"
required-features = ["autodiff"]

[[test]]
name = "ops_batched_bench_cuda"
required-features = ["cuda", "autodiff"]

[[test]]
name = "ops_batched_grad_cuda"
required-features = ["cuda", "autodiff"]

# Both of its `#[test]`s are `#[cfg(feature = "binary-tests")]` - per-test, not
# file-level, so the file compiles to an empty binary and reports 0/0 ok. The
# fixture it needs (`tests/ref_f64_broad.bin`) is committed, so the gate is
# real. Renamed from `test_chunk` when the target was retargeted at the f64
# oracle; the name no longer claims to be a comparison against "the reference"
# without saying which one.
[[test]]
name = "oracle_chunk"
required-features = ["binary-tests"]

# `oracle_breadth` deliberately has NO `[[test]]` block, and that is the correct
# shape, not an oversight. Its two `bench_ndarray_*` timings are NOT gated, so
# `tools/test_targets.py` counts the target as live on the default cell - which
# means a `required-features` block would make cargo SKIP the whole target
# there and those benchmarks would stop running. The 1000-case oracle test in
# the same file is `#[cfg(feature = "binary-tests")]` and runs only in the
# explicit `--features binary-tests` cell of `tools/lib_gate.sh`, exactly as
# `bit_exact`'s 1000-case test did before the rename. If a `[[test]]` block for
# it ever appears, the benchmarks are what breaks.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
