[package]
name = "burn-ptrn"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Probabilistic Tiny Recursive Model (PTRM) — test-time scaling for recursive models"
keywords = ["burn"]
repository = "https://github.com/sehaxe/burn-ptrn"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn = { workspace = true, features = ["ndarray", "std"] }
