[package]
name = "burn-mtp"
version = "0.1.0"
edition = "2021"
license = "MIT" # README badge + License section say MIT; keep in sync
description = "Multi-Token Prediction for Burn (Gloeckle et al. 2024 / DeepSeek-V3)"
keywords = ["burn", "mtp", "multi-token", "prediction", "llm"]
readme = "README.md"
repository = "https://github.com/sehaxe/burn-mtp"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn = { workspace = true, features = ["ndarray", "std"] }
