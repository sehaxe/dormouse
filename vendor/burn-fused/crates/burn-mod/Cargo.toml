[package]
name = "burn-mod"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mixture-of-Depths (Raposo et al. 2404.02258): expert-choice top-k token routing around transformer blocks"
keywords = ["burn", "mod", "mixture-of-depths", "top-k-routing"]
repository = "https://github.com/sehaxe/burn-mod"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn-autodiff = { workspace = true, features = ["std"] }
burn = { workspace = true, features = ["ndarray", "std", "autodiff"] }
