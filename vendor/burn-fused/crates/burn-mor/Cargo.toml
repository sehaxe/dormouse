[package]
name = "burn-mor"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Mixture-of-Recursions routing for Burn (Bae et al. 2025, arXiv 2507.10524)"
keywords = ["burn", "mor", "routing", "recursion", "moe"]
repository = "https://github.com/sehaxe/burn-mor"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn = { workspace = true, features = ["ndarray", "std"] }
