[package]
name = "burn-diffusionblocks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DiffusionBlocks for Burn - block-wise training of residual networks as diffusion denoisers (Sakana AI, arXiv 2506.14202): independent per-block score matching, memory /B vs BPTT"
keywords = ["burn", "diffusion", "score-matching", "denoising", "blockwise"]
repository = "https://github.com/sehaxe/burn-diffusionblocks"
homepage = "https://github.com/sehaxe/burn-diffusionblocks"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }
fastrand = "2"
libm = "0.2"

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn-autodiff = { workspace = true, features = ["std"] }
burn = { workspace = true, features = ["ndarray", "std", "autodiff"] }
