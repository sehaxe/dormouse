[package]
name = "burn-nope"
version = "0.1.0"
edition = "2021"
license = "MIT" # README badge + License section say MIT; keep in sync
description = "No Positional Encoding attention for Burn (Kimi K3 style)"
keywords = ["burn", "attention", "nope", "positional-encoding"]
readme = "README.md"
repository = "https://github.com/sehaxe/burn-nope"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn = { workspace = true, features = ["ndarray", "std"] }
