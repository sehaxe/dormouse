[package]
name = "burn-msa"
version = "0.2.4"
edition = "2021"
license = "MIT"
description = "MiniMax Sparse Attention (MSA) - block-sparse attention with per-GQA-group top-k block selection for Burn"
keywords = ["burn", "attention", "sparse", "gqa", "transformer"]
repository = "https://github.com/sehaxe/burn-msa"
homepage = "https://github.com/sehaxe/burn-msa"
documentation = "https://docs.rs/burn-msa"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]
cuda = ["dep:burn-cuda", "dep:burn-cubecl", "dep:cubecl", "burn/cuda", "burn-tensor/cuda"]
autodiff = ["burn/autodiff", "burn-tensor/std", "dep:burn-autodiff"]
cubecl = ["dep:cubecl"]
serde = ["dep:serde"]

[dependencies]
burn = { workspace = true, features = ["std", "extension"] }
burn-nn = { workspace = true }
burn-tensor = { workspace = true }
burn-rope = { path = "../burn-rope" }
burn-autodiff = { workspace = true, optional = true, features = ["std"] }
burn-cuda = { workspace = true, optional = true }
burn-cubecl = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true, features = ["std"] }
futures-lite = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn-autodiff = { workspace = true, features = ["std"] }
# ponytail: no `cuda` here — the ambient Device::default() then resolves to
# ndarray, keeping these correctness tests deterministic on CI. The fused CUDA
# kernel is covered by the cuda-gated tests in sparse_kernel.rs (topk >= 4).
burn = { workspace = true, features = ["ndarray", "autodiff", "extension"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
