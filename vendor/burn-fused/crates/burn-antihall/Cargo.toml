[package]
name = "burn-antihall"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Anti-Hallucination for Burn: per-neuron gates (H-Neurons 2512.01797) + detection"
keywords = ["burn", "hallucination", "suppression", "llm", "safety"]
repository = "https://github.com/sehaxe/burn-antihall"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn = { workspace = true, features = ["ndarray", "std"] }
