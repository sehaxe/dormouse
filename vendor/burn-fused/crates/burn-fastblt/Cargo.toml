[package]
name = "burn-fastblt"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Byte-Level BLT + FastBLT for Burn (Meta 2024/2026)"
keywords = ["burn", "blt", "byte-latent", "patching", "diffusion"]
repository = "https://github.com/sehaxe/burn-fastblt"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std"]

[dependencies]
burn = { workspace = true }
burn-tensor = { workspace = true }

[dev-dependencies]
burn-ndarray = { workspace = true, features = ["blas-openblas"] }
burn = { workspace = true, features = ["ndarray", "std"] }
