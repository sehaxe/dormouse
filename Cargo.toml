[workspace]
members = [
    "crates/cublas-poc",
    "crates/dormouse-core",
    "crates/dormouse-data",
    "crates/dormouse-train",
    "crates/dormouse-cli",
    "crates/backend-parity",
]
# vendored fork workspaces: they are their own workspace roots; without this
# cargo resolves their crates' `workspace = true` inheritance against OUR root.
exclude = ["vendor/burn-fused", "vendor/cubecl-fix", "vendor/cubek-fix"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
[profile.release]
lto = "thin"
# codegen-units = 1 serializes LLVM codegen per crate: with 20 cores the CPU
# idles and builds drag. 16 keeps every core busy; the training loop is GPU
# (cubecl) bound, so the runtime cost vs 1 is negligible.
codegen-units = 16

# Dev/test speed: burn-ndarray CPU matmuls at opt-level 0 made tests 5-10x
# slower than they should be, so dependencies compile optimized while our
# own crates stay at 0 for fast iteration. `line-tables-only` keeps panic
# backtraces readable with much less debug info to link. Costs one full
# recompile when it landed (2026-09-22), then caches.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# ...except our own crates: keep them at 0 so incremental builds stay fast.
[profile.dev.package.dormouse-core]
opt-level = 0
[profile.dev.package.dormouse-data]
opt-level = 0
[profile.dev.package.dormouse-train]
opt-level = 0
[profile.dev.package.dormouse-cli]
opt-level = 0

# Same patches as aria: stale-page-safe cubecl (#1401 root fix, ported onto
# 0.11.0-pre.4 where the pools moved into the new cubecl-server crate).
# cubek comes from crates.io (local /tmp/cubek with matmul tail fixes was
# lost to the tmpfs wipe; registry cubek 0.3.0-pre.4 has the fp4 helpers).
[patch.crates-io]
cubecl-runtime = { path = "vendor/cubecl-fix/cubecl-runtime" }
cubecl-server = { path = "vendor/cubecl-fix/cubecl-server" }
cubecl-cuda = { path = "vendor/cubecl-fix/cubecl-cuda" }
# cubecl-ir carries pliron's f16 size interfaces (ADR-0016 bug 3, ~40 lines in
# src/types/scalar.rs). pliron's `builtin.fp16` - the type `cube.f16` lowers to -
# implemented `FloatTypeInterface` and no `SizedType`, and the shared-memory
# sizing query (`cubecl-opt/src/lib.rs:36-40`) unwraps that cast. An f16 matmul
# is the one matmul that stages f16 tiles, so f16 is the one element type that
# reaches it: the candidate kernel panicked at compile, and the autotuner
# caught it and fell back to a non-accelerated routine, so f16 matmul was
# CORRECT and silently un-accelerated. SizedType is LOCAL to this crate, which
# is why the impl is legal here and not in a downstream crate. This is the only
# cubecl-ir change; the f64 and bf16 equivalents are deliberately not touched.
cubecl-ir = { path = "vendor/cubecl-fix/cubecl-ir" }
# cubek-reduce carries the top-k index kernel (ADR-0015). Vendored, not forked
# from a working copy: 0.3.0-pre.4's `reaches` fast-path guard cannot tell an
# empty top-k slot from one holding -inf, so a masked score row emits the
# `u32::MAX` seed coordinate as an index and the caller's gather reads out of
# bounds. Two hunks in src/components/instructions/{topk,base}.rs.
cubek-reduce = { path = "vendor/cubek-fix/cubek-reduce" }